<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم - Green Moon</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="nav"><img id="adminLogo" class="logo"><div class="brand"><h1>لوحة تحكم Green Moon</h1><small>التعديلات تظهر للعملاء فورًا بعد الحفظ</small></div><a class="btn light" href="/">عرض المتجر</a></div></header>
<main id="app" style="display:none"><div class="panel"><h2>الدخول للوحة التحكم</h2><div class="field"><label>كلمة مرور لوحة التحكم</label><input id="password" type="password" placeholder="اكتب كلمة المرور"></div><button class="btn green" id="login">دخول</button><span id="loginMsg"></span></div></main>
<main id="panel" style="display:none"><div class="panel"><h2>هوية الموقع</h2><img id="logoPreview" class="adminlogo"><div class="field"><label>تغيير اللوجو</label><input id="logoFile" type="file" accept="image/*"></div><div class="field"><label>اسم الموقع</label><input id="storeName"></div><div class="field"><label>رقم واتساب استقبال الطلبات (بصيغة دولية بدون +)</label><input id="whatsapp" placeholder="201xxxxxxxxx"></div><button class="btn green" id="saveSettings">حفظ إعدادات الموقع</button></div>
<div class="panel"><div class="admin-actions"><h2 style="margin:0">الطلبات</h2><span id="ordersCount" class="badge">0</span></div><div id="ordersList"></div></div>
<div class="panel"><div class="admin-actions"><button class="btn green" id="new">+ إضافة منتج</button><button class="btn" id="refreshOrders">تحديث الطلبات</button><button class="btn" id="reset">استرجاع المنتجات الأصلية</button><button class="btn" id="logout">خروج</button></div><div class="tablewrap"><table><thead><tr><th>الصورة</th><th>اسم المنتج</th><th>التفاصيل</th><th>السعر</th><th>الإجراءات</th></tr></thead><tbody id="table"></tbody></table></div></div></main>
<div id="editModal" class="modal"><div class="modalbox"><h2>بيانات المنتج</h2><input id="pid" type="hidden"><div class="field"><label>اسم المنتج</label><input id="pname"></div><div class="field"><label>السعر</label><input id="pprice" type="number" min="0"></div><div class="field"><label>التفاصيل</label><textarea id="pdetails"></textarea></div><div class="field"><label>صورة المنتج</label><input id="pimage" type="file" accept="image/*"></div><div class="admin-actions"><button class="btn green" id="saveP">حفظ</button><button class="btn" id="cancel">إلغاء</button></div></div></div>
<script>
let products=[],logo='',settings={},token=sessionStorage.getItem('gmAdminToken')||'';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opt={}){opt.headers=Object.assign({'content-type':'application/json'},opt.headers||{},token?{authorization:'Bearer '+token}:{});let r=await fetch(path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
async function load(){let [p,l,s]=await Promise.all([api('/api/products'),api('/api/logo'),api('/api/settings')]);products=p;logo=l.logo;settings=s;$('#logoPreview').src=logo;$('#adminLogo').src=logo;$('#storeName').value=settings.storeName||'';$('#whatsapp').value=settings.whatsapp||'';render()}
function render(){$('#table').innerHTML=products.map(p=>`<tr><td><img src="${esc(p.image)}" style="width:65px;height:65px;object-fit:cover;border-radius:8px"></td><td>${esc(p.name)}</td><td>${esc(p.details)}</td><td>${p.price||0} ج.م</td><td><button class="btn green" onclick="edit(${p.id})">تعديل</button> <button class="btn" onclick="del(${p.id})">حذف</button></td></tr>`).join('')}
function edit(id){let p=products.find(x=>x.id==id);openForm(p)}
function openForm(p=null){$('#editModal').classList.add('show');$('#pid').value=p?.id||'';$('#pname').value=p?.name||'';$('#pprice').value=p?.price||0;$('#pdetails').value=p?.details||'';$('#pimage').value=''}
function closeForm(){$('#editModal').classList.remove('show')}
async function saveProducts(){await api('/api/admin/products',{method:'PUT',body:JSON.stringify(products)})}
async function saveProduct(){let id=Number($('#pid').value),name=$('#pname').value.trim(),price=Number($('#pprice').value||0),details=$('#pdetails').value.trim(),file=$('#pimage').files[0];if(!name)return alert('اكتب اسم المنتج');let p=products.find(x=>x.id==id);if(!p){p={id:Date.now(),name,price,details,image:'/assets/product-1.jpg'};products.push(p)}p.name=name;p.price=price;p.details=details;if(file){let r=new FileReader();r.onload=async()=>{p.image=r.result;try{await saveProducts();closeForm();render();alert('تم الحفظ وظهر للعميل.')}catch(e){alert(e.message)}};r.readAsDataURL(file)}else{try{await saveProducts();closeForm();render();alert('تم الحفظ وظهر للعميل.')}catch(e){alert(e.message)}}}
async function del(id){if(!confirm('حذف المنتج؟'))return;products=products.filter(p=>p.id!=id);await saveProducts();render();}
async function changeLogo(){let f=$('#logoFile').files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let d=await api('/api/admin/logo',{method:'PUT',body:JSON.stringify({logo:r.result})});logo=d.logo;$('#logoPreview').src=logo;$('#adminLogo').src=logo;alert('تم تغيير اللوجو وظهر للعميل.')}catch(e){alert(e.message)}};r.readAsDataURL(f)}
async function settingsSave(){settings.storeName=$('#storeName').value.trim()||'Green Moon Plants and Flowers';settings.whatsapp=$('#whatsapp').value.trim();await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(settings)});alert('تم حفظ إعدادات الموقع.')}
async function reset(){if(confirm('استرجاع المنتجات الأصلية؟')){await api('/api/admin/reset',{method:'POST'});await load();alert('تم الاسترجاع.')}}
async function loadOrders(){try{let orders=await api('/api/admin/orders');renderOrders(orders)}catch(e){alert(e.message)}}
function renderOrders(orders){$('#ordersCount').textContent=orders.length;$('#ordersList').innerHTML=orders.length?orders.map(o=>`<div class="orderbox"><div class="admin-actions"><b>${esc(o.id)}</b><span>${new Date(o.createdAt).toLocaleString('ar-EG')}</span><select onchange="setOrderStatus('${o.id}',this.value)"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='تم الشحن'?'selected':''}>تم الشحن</option><option ${o.status==='مكتمل'?'selected':''}>مكتمل</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select><button class="btn" onclick="deleteOrder('${o.id}')">حذف</button></div><div><b>العميل:</b> ${esc(o.name)} — ${esc(o.phone)}</div><div><b>العنوان:</b> ${esc(o.governorate)}، ${esc(o.area)}، مبنى ${esc(o.building)}، دور ${esc(o.floor)}، شقة ${esc(o.apartment)}</div><div class="orderitems">${o.items.map(i=>`<div>${esc(i.name)} × ${i.quantity} = ${Number(i.lineTotal||0).toLocaleString('ar-EG')} ج.م</div>`).join('')}</div><div><b>الإجمالي: ${Number(o.total||0).toLocaleString('ar-EG')} ج.م</b>${o.notes?` — ${esc(o.notes)}`:''}</div></div>`).join(''):'<p>لا توجد طلبات حتى الآن.</p>'}
async function setOrderStatus(id,status){try{await api('/api/admin/orders',{method:'PUT',body:JSON.stringify({id,status})});await loadOrders()}catch(e){alert(e.message)}}
async function deleteOrder(id){if(!confirm('حذف الطلب نهائيًا؟'))return;try{await api('/api/admin/orders?id='+encodeURIComponent(id),{method:'DELETE'});await loadOrders()}catch(e){alert(e.message)}}
async function login(){token=$('#password').value;try{await load();sessionStorage.setItem('gmAdminToken',token);$('#app').style.display='none';$('#panel').style.display='block'}catch(e){token='';$('#loginMsg').textContent=' كلمة المرور غير صحيحة';}}
function logout(){sessionStorage.removeItem('gmAdminToken');location.reload()}
document.addEventListener('DOMContentLoaded',async()=>{if(token){try{await load();await loadOrders();$('#app').style.display='none';$('#panel').style.display='block'}catch(e){sessionStorage.removeItem('gmAdminToken');token='';$('#app').style.display='block'}}else $('#app').style.display='block';$('#login').onclick=login;$('#saveP').onclick=saveProduct;$('#cancel').onclick=closeForm;$('#new').onclick=()=>openForm();$('#reset').onclick=reset;$('#logout').onclick=logout;$('#logoFile').onchange=changeLogo;$('#saveSettings').onclick=settingsSave;$('#refreshOrders').onclick=loadOrders})
</script></body></html>
