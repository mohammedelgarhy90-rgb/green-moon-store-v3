name = "green-moon-store-v3-test"
main = "worker.js"
compatibility_date = "2026-09-20"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# REQUIRED: create a NEW KV namespace for this test Worker, then replace this placeholder.
# Never paste the production namespace ID here.
[[kv_namespaces]]
binding = "GREEN_MOON_KV"
id = "REPLACE_WITH_NEW_TEST_KV_NAMESPACE_ID"

[ai]
binding = "AI"
