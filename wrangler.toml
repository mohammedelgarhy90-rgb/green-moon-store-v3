name = "green-moon-store"
main = "worker.js"
compatibility_date = "2026-09-15"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "green-moon-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "./migrations"

[vars]
STORE_NAME = "Green Moon Plants & Flowers"
WHATSAPP = "201151054863"
