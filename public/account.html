<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><title>حسابي — Green Moon</title><style>body{margin:0;background:#f5f7f4;color:#17372c;font-family:Cairo,Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:25px auto}.card{background:#fff;border:1px solid #e0e7e1;border-radius:24px;padding:22px;box-shadow:0 12px 35px #12332912}.brand{text-align:center;color:#0b5b3d}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{padding:11px;border:0;border-radius:12px;background:#edf4ef;color:#0b5b3d;font-weight:800}.tab.active{background:#0b5b3d;color:#fff}.form{display:grid;gap:9px}.form input{padding:12px;border:1px solid #dfe7e1;border-radius:11px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:11px 15px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:800}.primary{background:#0b5b3d;color:#fff}.soft{background:#edf4ef;color:#0b5b3d}.order{padding:14px;border:1px solid #e2e8e3;border-radius:15px;margin-top:10px;background:#fbfcfb}.muted{color:#718078;font-size:12px}.error{color:#a72a21;background:#fff0ee;padding:10px;border-radius:10px}.prefs{display:grid;gap:10px}.prefs label{padding:12px;background:#f6f8f6;border-radius:12px;display:flex;justify-content:space-between}</style></head><body><div class="wrap"><div class="card"><div class="brand"><div style="font-size:42px">🌿</div><h1>Green Moon</h1><p>حسابك وطلباتك</p></div><div id="app"></div></div></div><script>const app=document.getElementById('app');let token=localStorage.getItem('gm_customer_token')||'';let mode='login';function h(){return token?{authorization:'Bearer '+token}:{}}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function authForm(){app.innerHTML=`<div class="tabs"><button class="tab ${mode==='login'?'active':''}" onclick="mode='login';authForm()">دخول</button><button class="tab ${mode==='register'?'active':''}" onclick="mode='register';authForm()">إنشاء حساب</button></div><div class="form" style="margin-top:15px">${mode==='register'?'<input id="nm" placeholder="الاسم">':''}<input id="ph" placeholder="رقم الموبايل"><input id="pw" type="password" placeholder="كلمة المرور"><button class="btn primary" onclick="submitAuth()">${mode==='login'?'دخول':'إنشاء الحساب'}</button><div id="msg"></div><a class="btn soft" href="/">🏠 دخول كزائر والعودة للمتجر</a></div>`}async function submitAuth(){const b={phone:document.getElementById('ph').value,password:document.getElementById('pw').value};if(mode==='register')b.name=document.getElementById('nm').value;b.guestKey=localStorage.getItem('gm_guest_key')||'';const r=await fetch('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok){document.getElementById('msg').className='error';document.getElementById('msg').textContent=d.error;return}token=d.token;localStorage.setItem('gm_customer_token',token);await renderAccount(d.account)}async function renderAccount(a){app.innerHTML=`<div><b>أهلاً ${esc(a.name)} 👋</b><div class="muted">${esc(a.phone)}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn soft" onclick="loadOrders()">📦 طلباتي</button><button class="btn soft" onclick="prefs()">🔔 الإشعارات</button><button class="btn primary" onclick="enablePush()">تفعيل الإشعارات</button><button class="btn soft" onclick="logout()">خروج</button></div><div id="area" style="margin-top:15px"></div></div>`;loadOrders()}async function loadOrders(){const r=await fetch('/api/account/orders',{headers:h()});const d=await r.json();if(!r.ok)return logout();document.getElementById('area').innerHTML='<h3>طلباتك</h3>'+(d.length?d.map(o=>`<div class="order"><b>#${esc(o.id)}</b><span class="btn primary" style="float:left;padding:6px 10px">${esc(o.status)}</span><div class="muted">${new Date(o.createdAt).toLocaleString('ar-EG')}</div><div style="margin-top:8px">الإجمالي: <b>${Number(o.total||0)} ج</b></div><div style="margin-top:9px"><a class="btn soft" href="${esc(o.trackingUrl)}">📦 تتبع الطلب</a></div></div>`).join(''):'<div class="muted">لسه مفيش طلبات على الحساب.</div>')}async function prefs(){const r=await fetch('/api/account/preferences',{headers:h()});const p=await r.json();document.getElementById('area').innerHTML=`<h3>إعدادات الإشعارات</h3><div class="prefs"><label>🎉 العروض والخصومات <input id="pr" type="checkbox" ${p.promotions!==false?'checked':''}></label><label>🌱 المنتجات الجديدة <input id="np" type="checkbox" ${p.newProducts!==false?'checked':''}></label><label>📦 تحديثات الطلب <input id="ou" type="checkbox" ${p.orderUpdates!==false?'checked':''}></label><button class="btn primary" onclick="savePrefs()">حفظ</button></div>`}async function savePrefs(){await fetch('/api/account/preferences',{method:'PUT',headers:{...h(),'content-type':'application/json'},body:JSON.stringify({promotions:document.getElementById('pr').checked,newProducts:document.getElementById('np').checked,orderUpdates:document.getElementById('ou').checked})});alert('تم حفظ الإعدادات')}async function enablePush(){try{const p=await Notification.requestPermission();if(p!=='granted')throw Error();const reg=await navigator.serviceWorker.register('/sw.js');const cfg=await fetch('/api/push/config').then(r=>r.json());let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:(s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a})(cfg.publicKey)});await fetch('/api/push/subscribe',{method:'POST',headers:{...h(),'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),guestKey:localStorage.getItem('gm_guest_key')||''})});alert('تم تفعيل الإشعارات 🔔')}catch(e){alert('تعذر تفعيل الإشعارات')}}function logout(){localStorage.removeItem('gm_customer_token');token='';authForm()}async function start(){if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});if(token){const r=await fetch('/api/auth/me',{headers:h()});const d=await r.json();if(d.authenticated)return renderAccount(d.account)}authForm()}start()</script></body></html>
