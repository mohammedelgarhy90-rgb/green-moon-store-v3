<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Moon Plants & Flowers</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:#f5f3ec;
      color:#173d2a;
    }
    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer}

    header{
      background:#123b28;
      color:#fff;
      padding:12px 18px;
      position:sticky;
      top:0;
      z-index:50;
      box-shadow:0 2px 10px #0002;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand img{
      width:55px;
      height:55px;
      object-fit:contain;
      border-radius:50%;
      background:#fff;
    }

    .brand-title{
      font-size:18px;
      font-weight:bold;
    }

    .brand-sub{
      font-size:12px;
      opacity:.8;
      margin-top:3px;
    }

    .admin-link{
      color:#fff;
      text-decoration:none;
      background:#ffffff18;
      padding:9px 12px;
      border-radius:10px;
      font-size:13px;
    }

    .hero{
      background:linear-gradient(135deg,#174d32,#286b43);
      color:#fff;
      padding:45px 20px;
      text-align:center;
    }

    .hero h1{
      margin:0 0 10px;
      font-size:32px;
    }

    .hero p{
      margin:0;
      opacity:.9;
      font-size:16px;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:25px 15px 100px;
    }
