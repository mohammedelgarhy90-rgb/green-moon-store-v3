<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063f2d">
<title>Green Moon Plants & Flowers</title>
<style>
:root{--green:#063f2d;--green2:#07543b;--gold:#f5c84b;--cream:#fbfaf5;--ink:#17352b;--muted:#728178;--line:#e9eee9;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.gmNewMobile{min-height:100vh;padding-bottom:82px}.gmTop{height:76px;background:var(--green);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px #052f2266}.gmBrand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:900}.gmBrand img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#fff}.gmBrand span{font-size:15px;line-height:1.1}.gmActions{display:flex;gap:9px;align-items:center}.gmIcon{width:47px;height:47px;border-radius:16px;background:#043723;color:#ffe58b;display:grid;place-items:center;font-size:25px;position:relative}.gmCount{position:absolute;top:-5px;right:-4px;min-width:24px;height:24px;padding:0 5px;border-radius:20px;background:#f3c83f;color:#12382a;font-size:13px;font-weight:900;display:grid;place-items:center}.gmHero{margin:0;min-height:450px;background:var(--green);position:relative;overflow:hidden}.gmHero img{width:100%;height:450px;object-fit:cover;display:block}.gmHero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,37,26,.08),rgba(3,37,26,.78))}.gmHeroContent{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:center;padding:35px 32px;color:#fff;max-width:620px}.gmEyebrow{font-size:13px;letter-spacing:1px;opacity:.9;margin-bottom:8px}.gmHero h1{font-size:38px;line-height:1.15;margin:0 0 10px;font-weight:900}.gmHero h1 b{color:#ffd44e}.gmHero p{font-size:18px;line-height:1.7;margin:0 0 22px}.gmCTA{align-self:flex-start;background:#ffd45a;color:#173b2c;border-radius:999px;padding:15px 28px;font-weight:900;box-shadow:0 10px 24px #0003}.gmDots{position:absolute;z-index:3;bottom:16px;right:50%;transform:translateX(50%);display:flex;gap:6px}.gmDots i{width:7px;height:7px;background:#fff8;border-radius:50%}.gmDots i.on{width:23px;border-radius:99px;background:#ffd45a}.gmSection{padding:24px 16px}.gmServices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;background:#fff;margin:-2px 12px 0;border-radius:0 0 22px 22px;padding:15px 10px;box-shadow:0 8px 20px #063f2d12;position:relative;z-index:5}.gmService{text-align:center;color:var(--green);font-size:12px;font-weight:800}.gmService strong{display:block;font-size:22px;margin-bottom:5px}.gmHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.gmHead h2{font-size:21px;margin:0;font-weight:900}.gmHead a{font-size:12px;color:#0b7552;font-weight:800}.gmCats{display:flex;gap:14px;overflow:auto;padding:4px 2px 8px;scrollbar-width:none}.gmCats::-webkit-scrollbar,.gmProducts::-webkit-scrollbar{display:none}.gmCat{min-width:82px;text-align:center}.gmCat img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 5px 15px #063f2d18}.gmCat div{font-size:12px;font-weight:800;margin-top:7px;white-space:nowrap}.gmBanner{border-radius:22px;overflow:hidden;position:relative;background:#0b4d37;min-height:150px;margin-bottom:14px}.gmBanner img{width:100%;height:100%;min-height:150px;object-fit:cover;display:block}.gmBanner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#043622cc,#04362222)}.gmBannerText{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:center;padding:22px;color:#fff}.gmBannerText h3{font-size:23px;margin:0 0 6px}.gmBannerText p{margin:0 0 12px;font-size:13px}.gmBannerText button{background:#ffd45a;color:#173b2c;padding:9px 16px;border-radius:999px;font-size:12px;font-weight:900;align-self:flex-start}.gmProducts{display:flex;gap:13px;overflow:auto;padding:3px 1px 12px;scrollbar-width:none}.gmProduct{background:#fff;border:1px solid var(--line);border-radius:19px;min-width:178px;overflow:hidden;box-shadow:0 6px 18px #12382a0c;position:relative}.gmProductImg{height:170px;background:#f4f5ef;position:relative}.gmProductImg img{width:100%;height:100%;object-fit:cover}.gmSticker{position:absolute;top:9px;right:9px;padding:6px 9px;border-radius:9px;background:#d43b32;color:#fff;font-size:10px;font-weight:900}.gmProductInfo{padding:11px}.gmProductName{font-size:13px;font-weight:900;min-height:38px}.gmPrices{display:flex;align-items:center;gap:8px;margin-top:8px}.gmPrice{font-size:17px;font-weight:900;color:#08704f}.gmOld{text-decoration:line-through;color:#9aa39e;font-size:11px}.gmProduct button{width:100%;margin-top:9px;padding:10px;border-radius:11px;background:var(--green);color:#fff;font-size:12px;font-weight:900}.gmSpace{min-height:220px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(135deg,#073c2b,#0a6145);margin:4px 0}.gmSpace img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}.gmSpace:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#043723e8,#04372322)}.gmSpaceContent{position:relative;z-index:2;padding:30px;color:#fff;max-width:75%}.gmSpaceContent h2{font-size:28px;line-height:1.3;margin:0 0 10px}.gmSpaceContent p{line-height:1.7;font-size:13px}.gmBottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid #e8ece8;display:grid;grid-template-columns:repeat(5,1fr);z-index:100;box-shadow:0 -5px 22px #0000000b}.gmBottom button{background:transparent;color:#53645c;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.gmBottom button b{font-size:22px;line-height:1}.gmBottom button.active{color:var(--green)}.gmBottom button.active b{background:#ffd45a;width:43px;height:43px;border-radius:50%;display:grid;place-items:center;margin-top:-20px;border:5px solid #fff;box-shadow:0 4px 13px #0002}.gmDrawer{position:fixed;inset:0;background:#0006;z-index:200;display:none}.gmDrawer.open{display:block}.gmDrawerPanel{width:min(340px,88%);height:100%;background:#fff;padding:25px;box-shadow:-10px 0 30px #0003}.gmDrawerTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.gmClose{width:40px;height:40px;border-radius:12px;background:#eef2ed;color:#063f2d;font-size:25px}.gmDrawer a{display:block;padding:15px 0;border-bottom:1px solid #edf0ed;color:var(--ink);font-weight:800}.gmModal{position:fixed;inset:0;background:#0007;z-index:300;display:none;align-items:flex-end}.gmModal.open{display:flex}.gmModalBox{background:#fff;width:100%;max-height:90vh;border-radius:25px 25px 0 0;padding:20px;overflow:auto;position:relative}.gmModalClose{position:absolute;left:15px;top:15px;width:40px;height:40px;border-radius:50%;background:#edf1ed;font-size:23px}.gmSearch{display:none;position:fixed;inset:0;background:#fff;z-index:250;padding:25px}.gmSearch.open{display:block}.gmSearch input{width:100%;padding:15px;border:1px solid #ddd;border-radius:15px;outline:none}.gmEmpty{padding:30px;text-align:center;color:#7c8780}
@media(min-width:760px){.gmHero,.gmHero img{height:520px}.gmHeroContent{padding-right:8%;}.gmSection{max-width:1100px;margin:auto}.gmServices{max-width:1100px;margin:-2px auto 0}.gmProduct{min-width:205px}.gmBottom{left:50%;right:auto;width:520px;transform:translateX(-50%);border-radius:22px 22px 0 0}}
</style>
</head>
<body>
<div id="gmNewMobile" class="gmNewMobile">
<header class="gmTop">
  <div class="gmActions"><button class="gmIcon" id="gmMenu">☰</button><button class="gmIcon" id="gmSearchBtn">⌕</button></div>
  <div class="gmBrand"><img id="gmLogo" src="/assets/logo.jpg" alt="Green Moon"><span>GREEN MOON<br><small>PLANTS & FLOWERS</small></span></div>
  <div class="gmActions"><button class="gmIcon" id="gmCart">🛒<span class="gmCount" id="gmCount">0</span></button></div>
</header>
<main>
<section class="gmHero" id="hero"><img id="heroImg" alt="Green Moon"><div class="gmHeroContent"><div class="gmEyebrow" id="heroEyebrow">GREEN MOON • PLANTS & FLOWERS</div><h1 id="heroTitle">خلي الطبيعة <b>جزء من مكانك</b></h1><p id="heroText">نباتات طبيعية.. حياة أجمل مع جرين مون</p><button class="gmCTA" id="heroCta">اكتشف مجموعتنا ›</button></div><div class="gmDots" id="heroDots"></div></section>
<div id="services" class="gmServices"></div>
<section class="gmSection" id="categoriesSection"><div class="gmHead"><h2 id="catHeading">تسوق حسب الفئة</h2><a href="#products">عرض الكل</a></div><div class="gmCats" id="categories"></div></section>
<section class="gmSection" id="bannersSection"><div id="banners"></div></section>
<section class="gmSection" id="productsSection"><div class="gmHead"><h2 id="productsHeading">وصل حديثًا</h2><a href="#products">كل المنتجات</a></div><div class="gmProducts" id="products"></div></section>
<section class="gmSection" id="spaceSection"><div class="gmSpace"><img id="spaceImg" alt="حوّل مساحتك"><div class="gmSpaceContent"><h2 id="spaceTitle">حوّل مساحتك لمساحة أجمل 🌿</h2><p id="spaceText">اختار النبات المناسب لمكانك وخلي كل ركن فيه حياة.</p><button class="gmCTA" id="spaceCta">اكتشف النباتات ›</button></div></div></section>
</main>
<nav class="gmBottom" id="bottomNav"></nav>
</div>
<div class="gmDrawer" id="drawer"><div class="gmDrawerPanel"><div class="gmDrawerTop"><strong>Green Moon</strong><button class="gmClose" id="drawerClose">×</button></div><div id="drawerLinks"></div></div></div>
<div class="gmSearch" id="searchBox"><button class="gmClose" id="searchClose">×</button><h2>ابحث عن نباتك 🌿</h2><input id="searchInput" placeholder="اكتب اسم النبات أو المنتج..."><div id="searchResults" class="gmProducts" style="margin-top:20px"></div></div>
<div class="gmModal" id="productModal"><div class="gmModalBox"><button class="gmModalClose" id="productClose">×</button><div id="productDetail"></div></div></div>
<script>
const state={settings:{},products:[],slides:[],slide:0,cart:[]};
const fallback={
 headings:{categories:'تسوق حسب الفئة',products:'وصل حديثًا'},
 spaceText:'اختار النبات المناسب لمكانك وخلي كل ركن فيه حياة.',spaceCta:'اكتشف النباتات',spaceLink:'#products',spaceImage:'',
 bottomNav:[['المتجر','🛍️','#products'],['الصفقات','🏷️','#deals'],['الرئيسية','⌂','#top'],['السلة','🛒','#cart'],['حسابي','♙','#account']],
 sections:{services:true,categories:true,banners:true,products:true,space:true},
 services:[{icon:'🚚',title:'توصيل لباب البيت'},{icon:'🌿',title:'نباتات مختارة بعناية'},{icon:'💬',title:'استشارة مجانية'}],
 banners:[]
};
async function getJSON(url,opts){const r=await fetch(url,opts);if(!r.ok)throw Error(await r.text());return r.json()}
function imgFallback(){return '/assets/logo.jpg'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function applySections(h){for(const [id,on] of Object.entries(h.sections||{})){const el=document.getElementById(id+'Section')||document.getElementById(id);if(el&&id!=='services')el.style.display=on===false?'none':''}const sv=document.getElementById('services');if(sv)sv.style.display=h.sections?.services===false?'none':''}
function renderServices(h){const arr=Array.isArray(h.services)&&h.services.length?h.services:fallback.services;document.getElementById('services').innerHTML=arr.map(x=>`<div class="gmService"><strong>${esc(x.icon||'🌿')}</strong>${esc(x.title||'')}</div>`).join('')}
function renderCats(){const cats=Array.isArray(state.settings.gm_categories)?state.settings.gm_categories:[];const el=document.getElementById('categories');if(!cats.length){el.innerHTML='<div class="gmEmpty">أضف التصنيفات من لوحة التحكم</div>';return}el.innerHTML=cats.filter(x=>x&&x.visible!==false).map(c=>`<button class="gmCat" onclick="filterCat('${esc(c.name)}')"><img src="${esc(c.image||imgFallback())}" onerror="this.src='${imgFallback()}'"><div>${esc(c.name)}</div></button>`).join('')}
function renderBanners(h){const arr=Array.isArray(h.banners)?h.banners:[];document.getElementById('banners').innerHTML=arr.filter(x=>x&&x.visible!==false).map(b=>`<div class="gmBanner"><img src="${esc(b.image||imgFallback())}" onerror="this.src='${imgFallback()}'"><div class="gmBannerText"><h3>${esc(b.title||'عرض من Green Moon')}</h3><p>${esc(b.text||'اكتشف اختياراتنا الجديدة')}</p><button onclick="goLink('${esc(b.link||'#products')}')">${esc(b.cta||'اكتشف الآن')} ›</button></div></div>`).join('')}
function productCard(p){const sticker=p.sticker&&p.sticker.active!==false&&p.sticker.text?`<span class="gmSticker" style="background:${esc(p.sticker.color||'#d43b32')}">${esc(p.sticker.text)}</span>`:'';const old=Number(p.oldPrice)>Number(p.price)?`<span class="gmOld">${Number(p.oldPrice)} ج.م</span>`:'';return `<article class="gmProduct"><div class="gmProductImg"><img src="${esc(p.image||imgFallback())}" onerror="this.src='${imgFallback()}'">${sticker}</div><div class="gmProductInfo"><div class="gmProductName">${esc(p.name||'منتج Green Moon')}</div><div class="gmPrices"><span class="gmPrice">${Number(p.price)||0} ج.م</span>${old}</div><button onclick="openProduct('${esc(p.id)}')">عرض التفاصيل</button></div></article>`}
function renderProducts(list=state.products){let h=state.settings.gm_home||{};let ids=Array.isArray(h.newProductIds)?h.newProductIds.map(String):[];let arr=ids.length?ids.map(id=>state.products.find(p=>String(p.id)===id)).filter(Boolean):list.slice(0,12);document.getElementById('products').innerHTML=arr.length?arr.map(productCard).join(''):'<div class="gmEmpty">لا توجد منتجات حاليًا</div>'}
function filterCat(name){renderProducts(state.products.filter(p=>String(p.category||'')===name))}
function renderHero(){const h=state.settings.gm_hero;let arr=Array.isArray(h)?h.filter(x=>x&&x.visible!==false):[];if(!arr.length){const p=state.products[0]||{};arr=[{image:p.image||imgFallback(),title:'خلي الطبيعة',highlight:'جزء من مكانك',text:'نباتات طبيعية.. حياة أجمل مع جرين مون',cta:'اكتشف مجموعتنا'}]}state.slides=arr.slice(0,10);state.slide=Math.min(state.slide,state.slides.length-1);showSlide()}
function showSlide(){const s=state.slides[state.slide]||{};document.getElementById('heroImg').src=s.image||imgFallback();document.getElementById('heroTitle').innerHTML=esc(s.title||'خلي الطبيعة')+' <b>'+esc(s.highlight||'جزء من مكانك')+'</b>';document.getElementById('heroText').textContent=s.text||'';document.getElementById('heroCta').textContent=(s.cta||'اكتشف الآن')+' ›';document.getElementById('heroCta').onclick=()=>goLink(s.link||'#products');document.getElementById('heroDots').innerHTML=state.slides.map((_,i)=>`<i class="${i===state.slide?'on':''}" onclick="state.slide=${i};showSlide()"></i>`).join('')}
function renderBottom(h){const arr=Array.isArray(h.bottomNav)&&h.bottomNav.length?h.bottomNav:fallback.bottomNav;document.getElementById('bottomNav').innerHTML=arr.slice(0,5).map((x,i)=>`<button class="${i===2?'active':''}" onclick="goLink('${esc(x[2]||'#top')}')"><b>${esc(x[1]||'•')}</b><span>${esc(x[0]||'')}</span></button>`).join('')}
function renderDrawer(h){const arr=Array.isArray(h.bottomNav)&&h.bottomNav.length?h.bottomNav:fallback.bottomNav;document.getElementById('drawerLinks').innerHTML=arr.map(x=>`<a href="${esc(x[2]||'#')}" onclick="closeDrawer()">${esc(x[0]||'')}</a>`).join('')+`<a href="#doctor" onclick="closeDrawer()">🩺 Green Moon Doctor</a>`}
function renderHome(){const h=Object.assign({},fallback,state.settings.gm_home||{});document.getElementById('catHeading').textContent=h.headings?.categories||fallback.headings.categories;document.getElementById('productsHeading').textContent=h.headings?.products||fallback.headings.products;document.getElementById('spaceTitle').textContent=h.spaceTitle||'حوّل مساحتك لمساحة أجمل 🌿';document.getElementById('spaceText').textContent=h.spaceText||fallback.spaceText;document.getElementById('spaceCta').textContent=(h.spaceCta||fallback.spaceCta)+' ›';document.getElementById('spaceCta').onclick=()=>goLink(h.spaceLink||'#products');if(h.spaceImage)document.getElementById('spaceImg').src=h.spaceImage;renderServices(h);renderCats();renderBanners(h);renderProducts();renderBottom(h);renderDrawer(h);applySections(h)}
function goLink(link){if(!link)return;if(link.startsWith('#')){document.querySelector(link)?.scrollIntoView({behavior:'smooth'});return}location.href=link}
function openProduct(id){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;document.getElementById('productDetail').innerHTML=`<img src="${esc(p.image||imgFallback())}" style="width:100%;height:280px;object-fit:cover;border-radius:18px"><h2>${esc(p.name)}</h2><p>${esc(p.details||p.description||'')}</p><div class="gmPrices"><b class="gmPrice">${Number(p.price)||0} ج.م</b>${Number(p.oldPrice)>Number(p.price)?`<span class="gmOld">${Number(p.oldPrice)} ج.م</span>`:''}</div><button class="gmCTA" style="margin-top:18px;width:100%" onclick="addCart('${esc(p.id)}');closeProduct()">أضف للسلة</button>`;document.getElementById('productModal').classList.add('open')}
function closeProduct(){document.getElementById('productModal').classList.remove('open')}
function addCart(id){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;state.cart.push(p);document.getElementById('gmCount').textContent=state.cart.length}
function searchProducts(q){q=q.trim().toLowerCase();const list=q?state.products.filter(p=>String(p.name||'').toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q)):[];document.getElementById('searchResults').innerHTML=list.map(productCard).join('')||'<div class="gmEmpty">اكتب اسم المنتج للبحث</div>'}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
async function boot(){try{state.settings=await getJSON('/api/settings')}catch(e){state.settings={}}try{state.products=await getJSON('/api/products')}catch(e){state.products=[]}renderHero();renderHome();setInterval(()=>{if(state.slides.length>1){state.slide=(state.slide+1)%state.slides.length;showSlide()}},5000)}
document.getElementById('gmMenu').onclick=()=>document.getElementById('drawer').classList.add('open');document.getElementById('drawerClose').onclick=closeDrawer;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};document.getElementById('productClose').onclick=closeProduct;document.getElementById('productModal').onclick=e=>{if(e.target.id==='productModal')closeProduct()};document.getElementById('gmSearchBtn').onclick=()=>document.getElementById('searchBox').classList.add('open');document.getElementById('searchClose').onclick=()=>document.getElementById('searchBox').classList.remove('open');document.getElementById('searchInput').oninput=e=>searchProducts(e.target.value);document.getElementById('gmCart').onclick=()=>alert(state.cart.length?'عدد المنتجات في السلة: '+state.cart.length:'السلة فارغة');
let sx=0;document.getElementById('hero').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.getElementById('hero').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){state.slide=(state.slide+(dx<0?1:-1)+state.slides.length)%state.slides.length;showSlide()}});
boot();
</script>
</body></html>
