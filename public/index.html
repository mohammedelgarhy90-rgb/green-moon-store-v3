<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Moon Plants and Flowers</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="nav"><img id="siteLogo" class="logo"><div class="brand"><h1 id="storeName">Green Moon Plants and Flowers</h1><small>نباتات وزهور طبيعية</small></div><a class="btn gold" href="/admin.html">لوحة التحكم</a></div></header>
<section class="hero"><h2>Green Moon Plants and Flowers 🌿</h2><p>اختار نباتاتك وحدد الكمية اللي محتاجها من كل منتج.</p></section>
<main class="wrap"><div class="toolbar"><input id="search" class="search" placeholder="ابحث عن نبات..."></div><section id="products" class="grid"></section></main>
<div id="cartbar" class="cartbar"><span>السلة: <b id="cartCount">0</b> قطعة</span><span id="cartTotal">0 ج.م</span><button class="btn light" id="viewCart">عرض الطلب</button></div>
<div id="cartModal" class="modal"><div class="modalbox"><h2>طلبك</h2><div id="cartItems"></div><div class="row"><div class="field"><label>الاسم</label><input id="custName"></div><div class="field"><label>رقم الهاتف</label><input id="custPhone"></div></div><div class="row"><div class="field"><label>المحافظة</label><input id="custGov"></div><div class="field"><label>المنطقة</label><input id="custArea"></div></div><div class="row"><div class="field"><label>رقم المبنى</label><input id="custBuilding"></div><div class="field"><label>الدور</label><input id="custFloor"></div><div class="field"><label>الشقة</label><input id="custApartment"></div></div><div class="field"><label>ملاحظات</label><textarea id="custNotes" placeholder="أي ملاحظات على الطلب أو التوصيل"></textarea></div><div class="admin-actions"><button class="btn green" id="submitOrder">تأكيد الطلب</button><button class="btn" id="closeCart">إغلاق</button></div></div></div>
<footer>© Green Moon Plants and Flowers</footer>
<script>
const FALLBACK=[{id:1,name:'أجلونيما بينك',details:'نبات أجلونيما بألوان وردي وأخضر مميزة، مناسب للديكور الداخلي.',price:0,image:'/assets/product-1.jpg'},{id:2,name:'أجلونيما بينك سبوت',details:'أوراق وردية كثيفة بتوزيعات خضراء جميلة.',price:0,image:'/assets/product-2.jpg'},{id:3,name:'أجلونيما بينك جرين',details:'أجلونيما بأوراق وردية زاهية وتفاصيل خضراء.',price:0,image:'/assets/product-3.jpg'},{id:4,name:'تشكيلة أجلونيما',details:'مجموعة من نباتات أجلونيما بألوان ونقوش مختلفة.',price:0,image:'/assets/product-4.jpg'},{id:5,name:'أجلونيما بينك فين',details:'أوراق خضراء بنقوش وردية وعروق وردية واضحة.',price:0,image:'/assets/product-5.jpg'},{id:6,name:'أجلونيما وايت',details:'أجلونيما بأوراق خضراء وبيضاء، مناسبة للمكاتب والبيوت.',price:0,image:'/assets/product-6.jpg'},{id:7,name:'بوتس مبرقش',details:'بوتس أخضر بتبرقش فاتح، نبات سهل العناية وسريع النمو.',price:0,image:'/assets/product-7.jpg'},{id:8,name:'أنثوريوم أبيض',details:'أنثوريوم بأزهار بيضاء وأوراق خضراء أنيقة.',price:0,image:'/assets/product-8.jpg'}];
let products=FALLBACK,cart=JSON.parse(localStorage.getItem('gmCart')||'{}'),settings={whatsapp:'',storeName:'Green Moon Plants and Flowers'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>Number(v||0).toLocaleString('ar-EG')+' ج.م';
async function load(){try{let [p,l,s]=await Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/logo').then(r=>r.json()),fetch('/api/settings').then(r=>r.json())]);products=p;$('#siteLogo').src=l.logo;settings=s;$('#storeName').textContent=s.storeName||'Green Moon Plants and Flowers'}catch(e){$('#siteLogo').src='/assets/logo.jpg'}render()}
function render(){let q=($('#search').value||'').toLowerCase();let list=products.filter(p=>(p.name+' '+p.details).toLowerCase().includes(q));$('#products').innerHTML=list.map(p=>`<article class="card"><img src="${esc(p.image)}" alt="${esc(p.name)}"><div class="cardbody"><h3>${esc(p.name)}</h3><div class="details">${esc(p.details)}</div><div class="price">${Number(p.price)>0?money(p.price):'السعر يحدد من المتجر'}</div><div class="qty"><button class="qbtn" onclick="changeQty(${p.id},-1)">−</button><span class="qnum">${cart[p.id]||0}</span><button class="qbtn" onclick="changeQty(${p.id},1)">+</button></div></div></article>`).join('')||'<p>لا توجد منتجات مطابقة.</p>';updateCart()}
function changeQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];localStorage.setItem('gmCart',JSON.stringify(cart));render()}
function updateCart(){let count=Object.values(cart).reduce((a,b)=>a+b,0),total=Object.entries(cart).reduce((t,[id,q])=>t+(Number(products.find(p=>p.id==id)?.price)||0)*q,0);$('#cartCount').textContent=count;$('#cartTotal').textContent=money(total);$('#cartbar').classList.toggle('show',count>0)}
function openCart(){let rows=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id);return `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0"><span>${esc(p.name)} × ${q}</span><b>${money((p.price||0)*q)}</b></div>`}).join('');$('#cartItems').innerHTML=rows||'السلة فارغة';$('#cartModal').classList.add('show')}
async function submitOrder(){let name=$('#custName').value.trim(),phone=$('#custPhone').value.trim();if(!name||!phone)return alert('اكتب الاسم ورقم الهاتف');let items=Object.entries(cart).map(([id,q])=>({productId:id,quantity:q}));let payload={name,phone,governorate:$('#custGov').value.trim(),area:$('#custArea').value.trim(),building:$('#custBuilding').value.trim(),floor:$('#custFloor').value.trim(),apartment:$('#custApartment').value.trim(),notes:$('#custNotes').value.trim(),items};let saved;try{let r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});saved=await r.json();if(!r.ok)throw new Error(saved.error||'تعذر حفظ الطلب');}catch(e){return alert(e.message)}let text=`طلب جديد من ${settings.storeName}\nرقم الطلب: ${saved.order.id}\nالاسم: ${name}\nالهاتف: ${phone}\nالمحافظة: ${payload.governorate}\nالمنطقة: ${payload.area}\nالمبنى: ${payload.building}\nالدور: ${payload.floor}\nالشقة: ${payload.apartment}\n\n`+saved.order.items.map(i=>`${i.name} × ${i.quantity} — ${money(i.lineTotal)}`).join('\n')+`\n\nالإجمالي: ${money(saved.order.total)}`+(payload.notes?`\nملاحظات: ${payload.notes}`:'');if(settings.whatsapp){location.href='https://wa.me/'+settings.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(text)}else{navigator.clipboard?.writeText(text);alert('تم تسجيل الطلب بنجاح رقم '+saved.order.id+' ونسخ تفاصيله.')}cart={};localStorage.removeItem('gmCart');render();$('#cartModal').classList.remove('show')}
$('#search').addEventListener('input',render);$('#viewCart').onclick=openCart;$('#closeCart').onclick=()=>$('#cartModal').classList.remove('show');$('#submitOrder').onclick=submitOrder;load();
</script></body></html>
