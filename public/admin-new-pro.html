<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061f16">
<title>Green Moon — لوحة التحكم الاحترافية</title>
<style>
:root{--green:#06251a;--green2:#0b5b3d;--green3:#137451;--gold:#d9bc6a;--cream:#f8f7f1;--bg:#f2f4f1;--card:#fff;--ink:#15221c;--muted:#728078;--line:#e5e9e5;--danger:#b42318;--shadow:0 16px 45px #09251b12}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#041b12,#0a4a32);color:#fff;border-bottom:1px solid #ffffff12}.topin{max-width:1500px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#fff,#d9bc6a);display:grid;place-items:center;color:#06301f;font-size:22px;box-shadow:0 8px 22px #0003}.brand b{display:block;font-size:17px}.brand small{opacity:.68}.topactions{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff18;background:#ffffff0f;color:#fff}.wrap{max-width:1500px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.side{position:sticky;top:78px;height:max-content;background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}.nav{width:100%;border:0;background:transparent;color:#53615a;text-align:right;padding:12px 13px;border-radius:13px;font-weight:800;margin:2px 0;display:flex;align-items:center;gap:10px}.nav:hover,.nav.active{background:#eaf3ee;color:var(--green2)}.nav .ico{width:28px;text-align:center}.sectiontitle{font-size:11px;color:#9aa39e;font-weight:900;padding:14px 13px 5px}.content{min-width:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.stat .k{font-size:29px;font-weight:900}.stat .l{color:var(--muted);font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.head h2{margin:0;font-size:19px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850}.primary{background:var(--green);color:#fff}.gold{background:#f7efda;color:#6d551d}.soft{background:#eaf3ee;color:var(--green2)}.danger{background:#fff0ee;color:var(--danger)}.ghost{background:#f3f5f3;color:#44534c}.btn:disabled{opacity:.5;cursor:not-allowed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:850;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;background:#fff}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#83a999;box-shadow:0 0 0 3px #0b5b3d12}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}.table th{font-size:12px;color:#6c7972;background:#fafbfa}.thumb{width:56px;height:56px;border-radius:13px;object-fit:cover;background:#edf1ed}.status{display:inline-flex;padding:5px 9px;border-radius:99px;background:#eaf3ee;color:#0b5b3d;font-size:11px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.cardmedia{height:170px;background:#edf1ed;position:relative}.cardmedia img{width:100%;height:100%;object-fit:cover}.cardbody{padding:13px}.cardbody h3{margin:0 0 5px;font-size:16px}.cardbody p{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.6}.cardactions{display:flex;gap:7px;flex-wrap:wrap}.drag{cursor:grab;border:1px dashed #b9c5be}.upload{border:1.5px dashed #aab8b0;border-radius:16px;padding:12px;background:#fafcfa}.uploadrow{display:flex;align-items:center;gap:12px}.preview{width:96px;height:76px;border-radius:13px;object-fit:cover;background:#edf1ed}.upload input{display:none}.dropbtn{display:inline-flex}.hint{font-size:11px;color:var(--muted);margin-top:6px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.modal{position:fixed;inset:0;background:#03140db8;z-index:100;display:grid;place-items:center;padding:15px}.modalbox{width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;position:relative;box-shadow:0 30px 100px #0005}.x{position:absolute;left:13px;top:13px;width:40px;height:40px;border-radius:50%;border:0;background:#eef2ee;font-size:25px}.modalhead{padding-left:45px;margin-bottom:16px}.modalhead h2{margin:0}.modalfoot{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}.toast{position:fixed;left:18px;bottom:18px;z-index:200;background:#102b20;color:#fff;padding:12px 16px;border-radius:13px;box-shadow:0 12px 35px #0004}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 80% 10%,#d9bc6a22,transparent 25%),linear-gradient(145deg,#031a11,#0a4b33)}.loginbox{width:min(440px,100%);background:#fff;border-radius:28px;padding:30px;box-shadow:0 35px 100px #0005}.loginmark{width:65px;height:65px;border-radius:20px;background:linear-gradient(145deg,#fff,#d9bc6a);display:grid;place-items:center;font-size:34px;margin-bottom:15px}.loginbox h1{margin:0}.muted{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}.mobilebar{display:none}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.sectiontitle{display:none}.nav{width:auto;white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{padding:10px}.topin{padding:10px}.brand small{display:none}.grid2,.grid3{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.panel{padding:13px;border-radius:18px}.side{border-radius:17px}.stats{gap:8px}.stat{padding:13px}.stat .k{font-size:24px}.mobilebar{display:block;height:8px}.modal{padding:8px}.modalbox{border-radius:19px;padding:15px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <div class="loginmark">🌿</div>
    <h1>Green Moon</h1>
    <p class="muted">لوحة التحكم الاحترافية</p>
    <div class="field" style="margin-top:18px"><label>كلمة مرور الإدارة</label><input id="pass" type="password" placeholder="••••••••"></div>
    <button class="btn primary" style="width:100%;margin-top:11px" onclick="login()">دخول إلى لوحة التحكم</button>
    <div id="loginMsg" style="color:#b42318;font-weight:800;margin-top:10px;min-height:22px"></div>
  </div>
</div>

<div id="app" class="hidden">
<header class="top"><div class="topin">
  <div class="brand"><div class="brandmark">🌿</div><div><b>Green Moon Admin</b><small>إدارة المتجر بالكامل</small></div></div>
  <div class="topactions"><button class="iconbtn" title="تحديث" onclick="load()">↻</button><button class="iconbtn" title="خروج" onclick="logout()">↪</button></div>
</div></header>
<main class="wrap"><div class="layout">
<aside class="side">
  <div class="sectiontitle">المتجر</div>
  <button class="nav active" data-tab="home"><span class="ico">📊</span> الرئيسية</button>
  <button class="nav" data-tab="products"><span class="ico">🌿</span> المنتجات</button>
  <button class="nav" data-tab="categories"><span class="ico">🗂️</span> التصنيفات</button>
  <div class="sectiontitle">المحتوى</div>
  <button class="nav" data-tab="hero"><span class="ico">🖼️</span> Hero والعروض الرئيسية</button>
  <button class="nav" data-tab="deals"><span class="ico">🎯</span> الصفقات</button>
  <button class="nav" data-tab="articles"><span class="ico">📰</span> المقالات</button>
  <button class="nav" data-tab="rewards"><span class="ico">🎁</span> المكافآت</button>
  <div class="sectiontitle">التشغيل</div>
  <button class="nav" data-tab="orders"><span class="ico">📦</span> الطلبات</button>
  <button class="nav" data-tab="settings"><span class="ico">⚙️</span> الإعدادات</button>
</aside>
<section id="content" class="content"></section>
</div></main></div>

<div id="modal" class="modal hidden"><div class="modalbox"><button class="x" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const $=id=>document.getElementById(id), KEY='gm_admin_password_new';
let D={products:[],orders:[],settings:{},shipping:0,categories:[],hero:[],deals:[],articles:[],rewards:{}},tab='home';

const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const token=()=>sessionStorage.getItem(KEY)||'';
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()});
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error((d.error||'حدث خطأ')+(d.details?' — '+d.details:'')+' ['+r.status+']');return d}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),1800)}
function logout(){sessionStorage.removeItem(KEY);location.reload()}

async function login(){
 const p=$('pass').value.trim(); if(!p){$('loginMsg').textContent='اكتب كلمة المرور';return}
 sessionStorage.setItem(KEY,p);
 try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}
 catch(e){sessionStorage.removeItem(KEY);$('loginMsg').textContent=e.message}
}
async function load(){
 D.products=await api('/api/admin/products');
 D.orders=await api('/api/admin/orders');
 D.settings=await api('/api/admin/settings');
 D.shipping=(await api('/api/admin/shipping')).price||0;
 const s=D.settings||{};
 D.categories=s.gm_categories||[]; D.hero=s.gm_hero||[]; D.deals=s.gm_deals||[]; D.articles=s.gm_articles||[]; D.rewards=s.gm_rewards||{};
 render();
}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
function render(){const f={home,products,categories,hero,deals,articles,rewards,orders,settings};$('content').innerHTML=f[tab]()}
function home(){
 return `<div class="stats">
 <div class="stat"><div class="k">${D.products.length}</div><div class="l">إجمالي المنتجات</div></div>
 <div class="stat"><div class="k">${D.categories.length}</div><div class="l">التصنيفات</div></div>
 <div class="stat"><div class="k">${D.deals.length}</div><div class="l">الصفقات</div></div>
 <div class="stat"><div class="k">${D.orders.length}</div><div class="l">الطلبات</div></div></div>
 <div class="panel"><div class="head"><div><h2>مرحبًا بك في Green Moon 🌿</h2><p>من هنا تقدر تدير كل محتوى المتجر بدون كتابة روابط صور.</p></div></div>
 <div class="grid3"><button class="btn soft" onclick="go('products')">🌿 إدارة المنتجات</button><button class="btn soft" onclick="go('hero')">🖼️ إدارة Hero</button><button class="btn soft" onclick="go('deals')">🎯 إدارة الصفقات</button></div></div>
 <div class="panel"><div class="head"><div><h2>آخر الطلبات</h2><p>أحدث الطلبات المسجلة</p></div><button class="btn ghost" onclick="go('orders')">عرض الكل</button></div>${D.orders.length?`<div class="tablewrap"><table class="table"><tr><th>رقم</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th></tr>${D.orders.slice(0,5).map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.name)}</td><td>${+o.total||0} ج</td><td><span class="status">${esc(o.status||'جديد')}</span></td></tr>`).join('')}</table></div>`:`<div class="empty">لا توجد طلبات حتى الآن.</div>`}</div>`;
}
function go(t){tab=t;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}

function products(){
 return `<div class="panel"><div class="head"><div><h2>🌿 المنتجات</h2><p>إضافة وتعديل الصور والأسعار والتصنيفات — رفع الصورة من جهازك مباشرة.</p></div><button class="btn primary" onclick="productForm()">+ إضافة منتج</button></div>
 <div class="tablewrap"><table class="table"><tr><th>الصورة</th><th>المنتج</th><th>السعر</th><th>الجملة</th><th>التصنيف</th><th>إجراءات</th></tr>
 ${D.products.length?D.products.map(p=>`<tr><td><img class="thumb" src="${esc(p.image||'/assets/logo.jpg')}"></td><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.details||'')}</small></td><td>${+p.price||0} ج</td><td>${+p.wholesalePrice||0} ج</td><td>${esc(p.category||'—')}</td><td><button class="btn soft" onclick="productForm('${esc(p.id)}')">تعديل</button> <button class="btn danger" onclick="delProduct('${esc(p.id)}')">حذف</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">لا توجد منتجات.</td></tr>`}
 </table></div></div>`;
}
function productForm(id){
 const p=id?D.products.find(x=>String(x.id)===String(id)):{name:'',details:'',price:0,wholesalePrice:0,shippingPrice:0,image:'',category:''};
 openModal(id?'تعديل المنتج':'إضافة منتج',`<div class="grid2">
 <div class="field"><label>اسم المنتج</label><input id="pn" value="${esc(p.name)}"></div>
 <div class="field"><label>التصنيف</label><select id="pc">${D.categories.map(c=>`<option ${String(c.name)===String(p.category)?'selected':''}>${esc(c.name)}</option>`).join('')}<option ${!p.category?'selected':''}>بدون تصنيف</option></select></div>
 <div class="field"><label>سعر البيع</label><input id="pp" type="number" value="${+p.price||0}"></div>
 <div class="field"><label>سعر الجملة</label><input id="pw" type="number" value="${+p.wholesalePrice||0}"></div>
 <div class="field"><label>شحن المنتج</label><input id="ps" type="number" value="${+p.shippingPrice||0}"></div>
 </div>
 <div class="field" style="margin-top:12px"><label>صورة المنتج</label>${uploadBox('pi',p.image||'', '1000 × 1000 بكسل — JPG / PNG / WebP')}</div>
 <div class="field" style="margin-top:12px"><label>تفاصيل المنتج</label><textarea id="pd">${esc(p.details||'')}</textarea></div>
 <div class="modalfoot"><button class="btn primary" onclick="saveProduct('${id||''}')">حفظ المنتج</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function uploadBox(id,val,hint){
 return `<div class="upload"><div class="uploadrow"><img id="${id}_preview" class="preview" src="${esc(val||'/assets/logo.jpg')}"><div><label class="btn soft dropbtn" for="${id}_file">📷 اختيار صورة</label><input id="${id}_file" type="file" accept="image/*" onchange="handleImage(this,'${id}_preview','${id}_value')"><input id="${id}_value" type="hidden" value="${esc(val||'')}"><div class="hint">${hint}. الصورة يتم تصغيرها تلقائيًا وتحويلها إلى WebP.</div></div></div></div>`;
}
async function handleImage(input,previewId,valueId){
 const f=input.files?.[0];if(!f)return;
 if(!f.type.startsWith('image/')){toast('اختار ملف صورة');return}
 try{const data=await resizeImage(f,1400,1400,.84);$(previewId).src=data;$(valueId).value=data;toast('تم تجهيز الصورة')}catch(e){toast('تعذر تجهيز الصورة')}
}
function resizeImage(file,maxW,maxH,quality){
 return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,s=Math.min(1,maxW/w,maxH/h);w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/webp',quality))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})
}
async function saveProduct(id){
 const b={name:$('pn').value,category:$('pc').value==='بدون تصنيف'?'':$('pc').value,price:+$('pp').value||0,wholesalePrice:+$('pw').value||0,shippingPrice:+$('ps').value||0,image:$('pi_value').value,details:$('pd').value};
 if(id)b.id=id;await api('/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await load();toast('تم حفظ المنتج بنجاح')}
async function delProduct(id){if(!confirm('هل تريد حذف المنتج؟'))return;await api('/api/admin/products',{method:'DELETE',body:JSON.stringify({id})});await load();toast('تم حذف المنتج')}

function categories(){return collection('categories','🗂️ التصنيفات','اسم التصنيف + صورة + المنتجات التابعة له','category')}
function hero(){return collection('hero','🖼️ Hero الرئيسي','حتى 10 شرائح — صورة، عنوان، نص، زر، ورابط','hero')}
function deals(){return collection('deals','🎯 الصفقات والعروض','العروض مع وقت بداية ونهاية وعدّاد تنازلي','deal')}
function articles(){return collection('articles','📰 المقالات والأخبار','محتوى تثقيفي أو أخبار المتجر','article')}
function collection(type,title,sub,kind){
 const a=D[type]||[];
 return `<div class="panel"><div class="head"><div><h2>${title}</h2><p>${sub}</p></div><button class="btn primary" onclick="collectionForm('${type}')">+ إضافة</button></div>
 <div class="cards">${a.length?a.map((x,i)=>`<div class="card drag" draggable="true" data-id="${esc(x.id)}" ondragstart="dragStart(event,'${type}')" ondragover="event.preventDefault()" ondrop="dropItem(event,'${type}')"><div class="cardmedia"><img src="${esc(x.image||'/assets/logo.jpg')}"></div><div class="cardbody"><h3>${esc(x.title||x.name||'بدون عنوان')}</h3><p>${esc(x.text||x.description||'')}</p>${type==='deals'&&x.endAt?`<p><b>ينتهي:</b> ${esc(x.endAt)}</p>`:''}<div class="cardactions"><button class="btn soft" onclick="collectionForm('${type}','${esc(x.id)}')">تعديل</button><button class="btn danger" onclick="collectionDelete('${type}','${esc(x.id)}')">حذف</button><span class="btn ghost">☰ ${i+1}</span></div></div></div>`).join(''):`<div class="empty">لا يوجد محتوى. اضغط إضافة للبدء.</div>`}</div></div>`;
}
function collectionForm(type,id){
 const a=D[type]||[],x=id?a.find(z=>String(z.id)===String(id)):{id:Date.now(),title:'',name:'',text:'',description:'',image:'',link:'',cta:'اطلب الآن',startAt:'',endAt:'',active:true};
 let extra='';
 if(type==='categories') extra=`<div class="field"><label>المنتجات داخل التصنيف</label><div style="display:grid;gap:7px;max-height:210px;overflow:auto">${D.products.map(p=>`<label class="check"><input type="checkbox" class="catprod" value="${esc(p.id)}" ${(x.productIds||[]).map(String).includes(String(p.id))?'checked':''}> ${esc(p.name)}</label>`).join('')}</div></div>`;
 if(type==='hero') extra=`<div class="grid2"><div class="field"><label>نوع الشريحة</label><select id="ctype"><option value="offer" ${x.type==='offer'?'selected':''}>عرض</option><option value="article" ${x.type==='article'?'selected':''}>مقال</option><option value="product" ${x.type==='product'?'selected':''}>منتج</option></select></div><div class="field"><label>الرابط / الإجراء</label><input id="cl" value="${esc(x.link||'')}"></div></div>`;
 if(type==='deals') extra=`<div class="grid2"><div class="field"><label>بداية العرض</label><input id="cs" type="datetime-local" value="${esc(x.startAt||'')}"></div><div class="field"><label>نهاية العرض</label><input id="ce" type="datetime-local" value="${esc(x.endAt||'')}"></div></div>`;
 openModal(id?'تعديل المحتوى':'إضافة محتوى',`<div class="grid2">
 <div class="field"><label>العنوان</label><input id="ct" value="${esc(x.title||x.name||'')}"></div>
 <div class="field"><label>زر الإجراء</label><input id="cc" value="${esc(x.cta||'')}"></div>
 </div>
 <div class="field" style="margin-top:12px"><label>الصورة</label>${uploadBox('ci',x.image||'',type==='hero'?'1920 × 800 بكسل':'1200 × 800 بكسل')}</div>
 <div class="field" style="margin-top:12px"><label>الوصف</label><textarea id="cx">${esc(x.text||x.description||'')}</textarea></div>
 ${extra}
 <div class="modalfoot"><button class="btn primary" onclick="saveCollection('${type}','${id||''}')">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveCollection(type,id){
 const x={id:id||Date.now(),title:$('ct').value,image:$('ci_value').value,text:$('cx').value,cta:$('cc').value,link:$('cl')?.value||'',startAt:$('cs')?.value||'',endAt:$('ce')?.value||'',type:$('ctype')?.value||''};
 if(type==='categories')x.name=x.title,x.productIds=[...document.querySelectorAll('.catprod:checked')].map(e=>e.value);
 let a=D[type]||[];if(id){const i=a.findIndex(z=>String(z.id)===String(id));if(i>=0)a[i]=x}else a.push(x);D[type]=a;await saveContent();closeModal();toast('تم الحفظ')}
async function saveContent(){const s={...D.settings,gm_categories:D.categories,gm_hero:D.hero,gm_deals:D.deals,gm_articles:D.articles,gm_rewards:D.rewards};await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(s)});D.settings=s;render()}
async function collectionDelete(type,id){if(!confirm('حذف العنصر؟'))return;D[type]=(D[type]||[]).filter(x=>String(x.id)!==String(id));await saveContent();render();toast('تم الحذف')}
let dragData=null;function dragStart(e,type){dragData={type,id:e.currentTarget.dataset.id}}async function dropItem(e,type){if(!dragData||dragData.type!==type)return;const target=e.currentTarget.dataset.id,a=D[type]||[],from=a.findIndex(x=>String(x.id)===String(dragData.id)),to=a.findIndex(x=>String(x.id)===String(target));if(from<0||to<0||from===to)return;const [it]=a.splice(from,1);a.splice(to,0,it);await saveContent();render();dragData=null;toast('تم تغيير الترتيب')}

function rewards(){const r=D.rewards||{};return `<div class="panel"><div class="head"><div><h2>🎁 المكافآت والقواعد</h2><p>النصوص التي تظهر للعملاء يمكن تعديلها من هنا.</p></div><button class="btn primary" onclick="saveRewards()">حفظ</button></div><div class="grid2"><div class="field"><label>العنوان</label><input id="rt" value="${esc(r.title||'برنامج مكافآت Green Moon')}"></div><div class="field"><label>الرابط</label><input id="rl" value="${esc(r.link||'')}"></div></div><div class="field" style="margin-top:12px"><label>القواعد والتفاصيل</label><textarea id="rx" style="min-height:220px">${esc(r.text||'')}</textarea></div></div>`}
async function saveRewards(){D.rewards={title:$('rt').value,text:$('rx').value,link:$('rl').value};await saveContent();toast('تم حفظ المكافآت')}

function orders(){return `<div class="panel"><div class="head"><div><h2>📦 الطلبات</h2><p>متابعة وتغيير حالات الطلبات.</p></div><button class="btn soft" onclick="load()">↻ تحديث</button></div><div class="tablewrap"><table class="table"><tr><th>رقم</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th>تفاصيل</th></tr>${D.orders.map(o=>`<tr><td>${esc(o.id)}</td><td><b>${esc(o.name)}</b></td><td>${esc(o.phone)}</td><td>${+o.total||0} ج</td><td><select onchange="orderStatus('${esc(o.id)}',this.value)"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='تم الشحن'?'selected':''}>تم الشحن</option><option ${o.status==='مكتمل'?'selected':''}>مكتمل</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select></td><td><button class="btn soft" onclick="details('${esc(o.id)}')">عرض</button></td></tr>`).join('')}</table></div></div>`}
async function orderStatus(id,status){await api('/api/admin/orders',{method:'PUT',body:JSON.stringify({id,status})});await load();toast('تم تحديث حالة الطلب')}
function details(id){const o=D.orders.find(x=>String(x.id)===String(id));openModal('تفاصيل الطلب',`<pre style="white-space:pre-wrap;line-height:1.8;background:#f7f8f7;padding:13px;border-radius:13px">${esc(JSON.stringify(o,null,2))}</pre>`)}
function settings(){const s=D.settings||{};return `<div class="panel"><div class="head"><div><h2>⚙️ إعدادات المتجر</h2><p>بيانات المتجر والشحن.</p></div><button class="btn primary" onclick="saveSettings()">حفظ</button></div><div class="grid2"><div class="field"><label>اسم المتجر</label><input id="sn" value="${esc(s.storeName||'Green Moon Plants and Flowers')}"></div><div class="field"><label>عنوان الموقع</label><input id="st" value="${esc(s.title||'Green Moon 🌿')}"></div><div class="field"><label>الوصف</label><input id="ss" value="${esc(s.subtitle||'')}" ></div><div class="field"><label>واتساب</label><input id="sw" value="${esc(s.whatsapp||'')}"></div><div class="field"><label>الشحن العام</label><input id="sh" type="number" value="${D.shipping}"></div></div></div>`}
async function saveSettings(){D.settings={...D.settings,storeName:$('sn').value,title:$('st').value,subtitle:$('ss').value,whatsapp:$('sw').value};await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(D.settings)});await api('/api/admin/shipping',{method:'PUT',body:JSON.stringify({price:+$('sh').value||0})});await load();toast('تم حفظ الإعدادات')}

function openModal(title,body){$('modalBody').innerHTML=`<div class="modalhead"><h2>${title}</h2></div>${body}`;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if(token())login();
</script>
</body></html>
