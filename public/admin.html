<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم - Green Moon</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div class="nav">
    <img id="adminLogo" class="logo" src="/assets/logo.jpg">

    <div class="brand">
      <h1>لوحة تحكم Green Moon</h1>
      <small>التعديلات تظهر للعملاء فورًا بعد الحفظ</small>
    </div>

    <a class="btn light" href="/">عرض المتجر</a>
  </div>
</header>

<main id="loginBox">
  <div class="panel">
    <h2>الدخول للوحة التحكم</h2>

    <div class="field">
      <label>كلمة مرور لوحة التحكم</label>
      <input id="password" type="password" placeholder="اكتب كلمة المرور">
    </div>

    <button class="btn green" id="login">دخول</button>
    <span id="loginMsg"></span>
  </div>
</main>

<main id="panel" style="display:none">

  <div class="panel">
    <h2>إعدادات الموقع</h2>

    <img id="logoPreview" class="adminlogo" src="/assets/logo.jpg">

    <div class="field">
      <label>تغيير اللوجو</label>
      <input id="logoFile" type="file" accept="image/*">
    </div>

    <div class="field">
      <label>اسم الموقع</label>
      <input id="storeName">
    </div>

    <div class="field">
      <label>رقم واتساب استقبال الطلبات</label>
      <input id="whatsapp" placeholder="201xxxxxxxxx">
    </div>

    <div class="field">
      <label>سعر التوصيل للطلب بالكامل</label>
      <input id="shipping" type="number" min="0" placeholder="70">
    </div>

    <small>
      التوصيل يتحسب مرة واحدة لكل طلب مهما كان عدد المنتجات أو القطع.
    </small>

    <br><br>

    <button class="btn green" id="saveSettings">
      حفظ إعدادات الموقع
    </button>
  </div>


  <div class="panel">
    <div class="admin-actions">
      <h2 style="margin:0">الطلبات</h2>
      <span id="ordersCount" class="badge">0</span>
    </div>

    <div id="ordersList"></div>
  </div>


  <div class="panel">

    <div class="admin-actions">

      <button class="btn green" id="new">
        + إضافة منتج
      </button>

      <button class="btn" id="refreshOrders">
        تحديث الطلبات
      </button>

      <button class="btn" id="reset">
        استرجاع المنتجات الأصلية
      </button>

      <button class="btn" id="logout">
        خروج
      </button>

    </div>


    <div class="tablewrap">

      <table>

        <thead>
          <tr>
            <th>الصورة</th>
            <th>اسم المنتج</th>
            <th>التفاصيل</th>
            <th>سعر البيع</th>
            <th>سعر الجملة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>

        <tbody id="table"></tbody>

      </table>

    </div>

  </div>

</main>


<div id="editModal" class="modal">

  <div class="modalbox">

    <h2>بيانات المنتج</h2>

    <input id="pid" type="hidden">

    <div class="field">
      <label>اسم المنتج</label>
      <input id="pname">
    </div>

    <div class="field">
      <label>سعر البيع</label>
      <input id="pprice" type="number" min="0">
    </div>

    <div class="field">
      <label>سعر الجملة - للإدارة فقط</label>
      <input id="pwholesale" type="number" min="0">
    </div>

    <div class="field">
      <label>التفاصيل</label>
      <textarea id="pdetails"></textarea>
    </div>

    <div class="field">
      <label>صورة المنتج</label>
      <input id="pimage" type="file" accept="image/*">
    </div>

    <div class="admin-actions">

      <button class="btn green" id="saveP">
        حفظ
      </button>

      <button class="btn" id="cancel">
        إلغاء
      </button>

    </div>

  </div>

</div>


<script>

let products = [];
let settings = {};
let token = sessionStorage.getItem('gmAdminToken') || '';

const $ = s => document.querySelector(s);

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

const money = v =>
  Number(v || 0).toLocaleString('ar-EG') + ' ج.م';


async function api(path, options = {}) {

  options.headers = Object.assign(
    {
      'content-type':'application/json'
    },
    options.headers || {},
    token
      ? { authorization:'Bearer ' + token }
      : {}
  );

  const response = await fetch(path, options);

  const data =
    await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || 'حدث خطأ'
    );
  }

  return data;
}


async function load() {

  const result =
    await Promise.all([
      api('/api/admin/products'),
      api('/api/logo'),
      api('/api/settings'),
      fetch('/api/shipping').then(r => r.json())
    ]);

  products = result[0];
  settings = result[2] || {};

  const logo =
    result[1].logo || '/assets/logo.jpg';

  $('#adminLogo').src = logo;
  $('#logoPreview').src = logo;

  $('#storeName').value =
    settings.storeName ||
    'Green Moon Plants and Flowers';

  $('#whatsapp').value =
    settings.whatsapp || '';

  $('#shipping').value =
    Number(result[3].shipping) || 0;

  renderProducts();
}


function renderProducts() {

  $('#table').innerHTML =
    products.map(p => `

      <tr>

        <td>
          <img
            src="${esc(p.image)}"
            style="
              width:65px;
              height:65px;
              object-fit:cover;
              border-radius:8px
            "
          >
        </td>

        <td>${esc(p.name)}</td>

        <td>${esc(p.details)}</td>

        <td>${money(p.price)}</td>

        <td>${money(p.wholesalePrice)}</td>

        <td>

          <button
            class="btn green"
            onclick="editProduct(${p.id})"
          >
            تعديل
          </button>

          <button
            class="btn"
            onclick="deleteProduct(${p.id})"
          >
            حذف
          </button>

        </td>

      </tr>

    `).join('');
}


window.editProduct = function(id) {

  const product =
    products.find(p => p.id == id);

  $('#editModal').classList.add('show');

  $('#pid').value =
    product.id;

  $('#pname').value =
    product.name || '';

  $('#pprice').value =
    product.price || 0;

  $('#pwholesale').value =
    product.wholesalePrice || 0;

  $('#pdetails').value =
    product.details || '';

  $('#pimage').value = '';
};


$('#new').onclick = function() {

  $('#editModal').classList.add('show');

  $('#pid').value = '';

  $('#pname').value = '';

  $('#pprice').value = 0;

  $('#pwholesale').value = 0;

  $('#pdetails').value = '';

  $('#pimage').value = '';
};


$('#cancel').onclick = function() {

  $('#editModal').classList.remove('show');

};


async function saveProducts() {

  await api(
    '/api/admin/products',
    {
      method:'PUT',
      body:JSON.stringify(products)
    }
  );

}


$('#saveP').onclick = async function() {

  const id =
    Number($('#pid').value);

  const name =
    $('#pname').value.trim();

  if (!name) {
    alert('اكتب اسم المنتج');
    return;
  }

  let product =
    products.find(p => p.id == id);


  if (!product) {

    product = {
      id:Date.now(),
      name:'',
      details:'',
      price:0,
      wholesalePrice:0,
      image:'/assets/product-1.jpg'
    };

    products.push(product);
  }


  product.name =
    name;

  product.price =
    Number($('#pprice').value) || 0;

  product.wholesalePrice =
    Number($('#pwholesale').value) || 0;

  product.details =
    $('#pdetails').value.trim();


  const file =
    $('#pimage').files[0];


  const finish = async function() {

    try {

      await saveProducts();

      $('#editModal')
        .classList.remove('show');

      renderProducts();

      alert(
        'تم الحفظ وظهر للعميل.'
      );

    } catch(e) {

      alert(e.message);

    }

  };


  if (file) {

    const reader =
      new FileReader();

    reader.onload = async function() {

      product.image =
        reader.result;

      await finish();

    };

    reader.readAsDataURL(file);

  } else {

    await finish();

  }

};


window.deleteProduct = async function(id) {

  if (!confirm('حذف المنتج؟')) {
    return;
  }

  try {

    products =
      products.filter(
        p => p.id != id
      );

    await saveProducts();

    renderProducts();

  } catch(e) {

    alert(e.message);

  }

};


$('#logoFile').onchange =
  function() {

    const file =
      $('#logoFile').files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = async function() {

      try {

        const result =
          await api(
            '/api/admin/logo',
            {
              method:'PUT',
              body:JSON.stringify({
                logo:reader.result
              })
            }
          );

        $('#logoPreview').src =
          result.logo;

        $('#adminLogo').src =
          result.logo;

        alert('تم تغيير اللوجو.');

      } catch(e) {

        alert(e.message);

      }

    };

    reader.readAsDataURL(file);

  };


$('#saveSettings').onclick =
  async function() {

    try {

      settings.storeName =
        $('#storeName')
          .value
          .trim() ||
        'Green Moon Plants and Flowers';

      settings.whatsapp =
        $('#whatsapp')
          .value
          .trim();


      await api(
        '/api/admin/settings',
        {
          method:'PUT',
          body:JSON.stringify(settings)
        }
      );


      const shipping =
        Math.max(
          0,
          Number(
            $('#shipping').value
          ) || 0
        );


      await api(
        '/api/admin/shipping',
        {
          method:'PUT',
          body:JSON.stringify({
            shipping:shipping
          })
        }
      );


      alert(
        'تم حفظ إعدادات الموقع وسعر التوصيل.'
      );

    } catch(e) {

      alert(e.message);

    }

  };


async function loadOrders() {

  try {

    const orders =
      await api(
        '/api/admin/orders'
      );

    $('#ordersCount')
      .textContent =
      orders.length;


    $('#ordersList').innerHTML =
      orders.length

      ? orders.map(order => `

        <div class="orderbox">

          <div class="admin-actions">

            <b>
              ${esc(order.id)}
            </b>

            <span>
              ${new Date(
                order.createdAt
              ).toLocaleString('ar-EG')}
            </span>

            <select
              onchange="
                setOrderStatus(
                  '${esc(order.id)}',
                  this.value
                )
              "
            >

              <option
                ${order.status === 'جديد'
                  ? 'selected'
                  : ''}
              >
                جديد
              </option>

              <option
                ${order.status === 'قيد التجهيز'
                  ? 'selected'
                  : ''}
              >
                قيد التجهيز
              </option>

              <option
                ${order.status === 'تم الشحن'
                  ? 'selected'
                  : ''}
              >
                تم الشحن
              </option>

              <option
                ${order.status === 'مكتمل'
                  ? 'selected'
                  : ''}
              >
                مكتمل
              </option>

              <option
                ${order.status === 'ملغي'
                  ? 'selected'
                  : ''}
              >
                ملغي
              </option>

            </select>

            <button
              class="btn"
              onclick="
                deleteOrder('${esc(order.id)}')
              "
            >
              حذف
            </button>

          </div>


          <div>
            <b>العميل:</b>
            ${esc(order.name)}
            —
            ${esc(order.phone)}
          </div>


          <div>
            <b>العنوان:</b>

            ${esc(order.governorate)}

            ،

            ${esc(order.area)}

            ، الشارع:

            ${esc(order.street || '')}

            ، مبنى

            ${esc(order.building)}

            ، دور

            ${esc(order.floor)}

            ، شقة

            ${esc(order.apartment)}

          </div>


          <div class="orderitems">

            ${order.items.map(item => `

              <div>
                ${esc(item.name)}
                ×
                ${item.quantity}
                =
                ${money(item.lineTotal)}
              </div>

            `).join('')}

          </div>


          <div>
            <b>إجمالي المنتجات:</b>
            ${money(order.productsTotal)}
          </div>


          <div>
            <b>التوصيل:</b>
            ${money(order.shipping)}
          </div>


          <div>
            <b>الإجمالي النهائي:</b>
            ${money(order.total)}
          </div>


          ${
            order.notes
              ? `
                <div>
                  <b>ملاحظات:</b>
                  ${esc(order.notes)}
                </div>
              `
              : ''
          }

        </div>

      `).join('')

      : '<p>لا توجد طلبات حتى الآن.</p>';

  } catch(e) {

    alert(e.message);

  }

}


window.setOrderStatus =
  async function(id,status) {

    try {

      await api(
        '/api/admin/orders',
        {
          method:'PUT',
          body:JSON.stringify({
            id:id,
            status:status
          })
        }
      );

      await loadOrders();

    } catch(e) {

      alert(e.message);

    }

  };


window.deleteOrder =
  async function(id) {

    if (
      !confirm(
        'حذف الطلب نهائيًا؟'
      )
    ) {
      return;
    }

    try {

      await api(
        '/api/admin/orders?id=' +
        encodeURIComponent(id),
        {
          method:'DELETE'
        }
      );

      await loadOrders();

    } catch(e) {

      alert(e.message);

    }

  };


$('#refreshOrders').onclick =
  loadOrders;


$('#reset').onclick =
  async function() {

    if (
      !confirm(
        'استرجاع المنتجات الأصلية؟'
      )
    ) {
      return;
    }

    try {

      await api(
        '/api/admin/reset',
        {
          method:'POST'
        }
      );

      await load();

      alert('تم الاسترجاع.');

    } catch(e) {

      alert(e.message);

    }

  };


$('#logout').onclick =
  function() {

    sessionStorage.removeItem(
      'gmAdminToken'
    );

    location.reload();

  };


$('#login').onclick =
  async function() {

    token =
      $('#password').value;

    if (!token) {
      return;
    }

    try {

      await load();

      await loadOrders();

      sessionStorage.setItem(
        'gmAdminToken',
        token
      );

      $('#loginBox')
        .style.display = 'none';

      $('#panel')
        .style.display = 'block';

    } catch(e) {

      token = '';

      $('#loginMsg')
        .textContent =
        ' كلمة المرور غير صحيحة أو حدث خطأ.';

    }

  };


document.addEventListener(
  'DOMContentLoaded',
  async function() {

    if (token) {

      try {

        await load();

        await loadOrders();

        $('#loginBox')
          .style.display = 'none';

        $('#panel')
          .style.display = 'block';

      } catch(e) {

        sessionStorage.removeItem(
          'gmAdminToken'
        );

        token = '';

      }

    }

  }
);

</script>

</body>
</html>
