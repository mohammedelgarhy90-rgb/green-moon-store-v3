<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم - Green Moon</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <div class="nav">

    <img id="adminLogo" class="logo">

    <div class="brand">
      <h1>لوحة تحكم Green Moon</h1>
      <small>التعديلات تظهر للعملاء فورًا بعد الحفظ</small>
    </div>

    <a class="btn light" href="/">
      عرض المتجر
    </a>

  </div>
</header>


<main id="app" style="display:none">

  <div class="panel">

    <h2>الدخول للوحة التحكم</h2>

    <div class="field">
      <label>كلمة مرور لوحة التحكم</label>
      <input
        id="password"
        type="password"
        placeholder="اكتب كلمة المرور"
      >
    </div>

    <button class="btn green" id="login">
      دخول
    </button>

    <span id="loginMsg"></span>

  </div>

</main>


<main id="panel" style="display:none">

  <!-- إعدادات الموقع -->
  <div class="panel">

    <h2>هوية الموقع</h2>

    <img
      id="logoPreview"
      class="adminlogo"
    >

    <div class="field">
      <label>تغيير اللوجو</label>
      <input
        id="logoFile"
        type="file"
        accept="image/*"
      >
    </div>

    <div class="field">
      <label>اسم الموقع</label>
      <input id="storeName">
    </div>

    <div class="field">
      <label>
        رقم واتساب استقبال الطلبات
        (بصيغة دولية بدون +)
      </label>

      <input
        id="whatsapp"
        placeholder="201xxxxxxxxx"
      >
    </div>

    <div class="field">
      <label>
        سعر التوصيل للطلب بالكامل
      </label>

      <input
        id="shipping"
        type="number"
        min="0"
        placeholder="مثال: 70"
      >
    </div>

    <small>
      سعر التوصيل يتحسب مرة واحدة لكل طلب مهما كان عدد المنتجات أو القطع.
    </small>

    <button
      class="btn green"
      id="saveSettings"
    >
