<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم - Green Moon</title>
<link rel="stylesheet" href="/style.css">

<style>
.care-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.care-grid .field{
  margin:0;
}

@media(max-width:700px){
  .care-grid{
    grid-template-columns:1fr;
  }
}

.help{
  display:block;
  margin-top:5px;
  color:#777;
  font-size:12px;
}

.section-title{
  margin:20px 0 10px;
  padding-bottom:8px;
  border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <img id="adminLogo" class="logo" src="/assets/logo.jpg">

    <div class="brand">
      <h1>لوحة تحكم Green Moon</h1>
      <small>التعديلات تظهر للعملاء بعد الحفظ</small>
    </div>

    <a class="btn light" href="/">عرض المتجر</a>
  </div>
</header>


<main id="loginBox">
  <div class="panel">

    <h2>الدخول للوحة التحكم</h2>

    <div class="field">
      <label>كلمة مرور لوحة التحكم</label>
      <input
        id="password"
        type="password"
        placeholder="اكتب كلمة المرور"
      >
    </div>

    <button class="btn green" id="login">
      دخول
    </button>

    <span id="loginMsg"></span>

  </div>
</main>


<main id="panel" style="display:none">

  <!-- إعدادات الموقع -->

  <div class="panel">

    <h2>إعدادات الموقع</h2>

    <img
      id="logoPreview"
      class="adminlogo"
      src="/assets/logo.jpg"
    >

    <div class="field">
      <label>تغيير اللوجو</label>
      <input
        id="logoFile"
        type="file"
        accept="image/*"
      >
    </div>
