<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><title>لوحة الشحن — Green Moon</title><style>body{margin:0;background:#f4f7f4;font-family:Cairo,Tahoma,Arial;color:#17372c}.wrap{width:min(980px,calc(100% - 24px));margin:18px auto}.card{background:#fff;border-radius:22px;padding:18px;border:1px solid #e0e7e1;box-shadow:0 10px 30px #12332912}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:62px;height:62px;object-fit:contain;border-radius:15px;border:1px solid #e3e9e4}.brand h1{margin:0;color:#0b5b3d;font-size:24px}.muted{color:#718078;font-size:12px}.form{display:grid;gap:10px}.input{padding:12px;border:1px solid #dce6df;border-radius:11px;width:100%;box-sizing:border-box}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#0b5b3d;color:#fff}.soft{background:#eaf3ee;color:#0b5b3d}.order{border:1px solid #e1e8e3;border-radius:17px;padding:15px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.box{background:#f7faf7;border-radius:13px;padding:11px;margin-top:10px}.items{display:grid;gap:7px}.item{display:flex;justify-content:space-between;gap:10px;padding:9px;background:#fff;border-radius:10px;border:1px solid #edf0ed}.totals{display:grid;gap:6px;margin-top:10px}.total{font-size:18px;color:#0b5b3d}.error{color:#a72a21;background:#fff0ee;padding:10px;border-radius:10px}</style></head><body><div class="wrap"><div class="card"><div class="brand"><img src="/assets/logo.jpg" alt="Green Moon"><div><h1>لوحة الشحن</h1><div class="muted">Green Moon — تفاصيل الطلب وتحديث الشحنة</div></div></div><div id="app"></div></div></div><script>const app=document.getElementById('app');async function applyBrand(){try{const s=await fetch('/api/settings').then(r=>r.json());const logo=s?.gm_site?.media?.logo||s?.gm_site?.header?.logo||s?.logo||'/assets/logo.jpg';document.querySelector('.brand img').src=logo}catch(_){}};applyBrand();let token=localStorage.getItem('gm_courier_token')||'';function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function login(){app.innerHTML='<div class="form"><input id="pw" class="input" type="password" placeholder="كود شركة الشحن"><button class="btn primary" onclick="doLogin()">دخول</button><div id="m"></div></div>'}async function doLogin(){const r=await fetch('/api/courier/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const d=await r.json();if(!r.ok){document.getElementById('m').className='error';document.getElementById('m').textContent=d.error;return}token=d.token;localStorage.setItem('gm_courier_token',token);load()}function money(v){return Number(v||0).toLocaleString('ar-EG')+' ج'}function orderCard(o){const items=Array.isArray(o.items)?o.items:[];return `<div class="order"><div class="row"><div><b>طلب #${esc(o.id)}</b><div>${esc(o.name)} — ${esc(o.phone)}</div><div class="muted">${esc(o.address||'')}</div></div><b class="total">${money(o.total)}</b></div><div class="box"><b>🛍️ الأصناف</b><div class="items" style="margin-top:8px">${items.map(x=>`<div class="item"><span>${esc(x.name||'منتج')} × ${Number(x.quantity||1)}</span><b>${money(x.lineTotal??Number(x.price||0)*Number(x.quantity||1))}</b></div>`).join('')||'<div class="muted">لا توجد أصناف محفوظة</div>'}</div><div class="totals"><div class="row"><span>قيمة المنتجات</span><b>${money(o.productsTotal)}</b></div><div class="row"><span>الشحن</span><b>${money(o.shipping)}</b></div>${Number(o.promoDiscount||0)>0?`<div class="row"><span>خصم ${esc(o.promoCode||'')}</span><b>- ${money(o.promoDiscount)}</b></div>`:''}<div class="row total"><span>الإجمالي النهائي</span><b>${money(o.total)}</b></div></div></div>${o.notes?`<div class="box"><b>📝 ملاحظات العميل</b><div>${esc(o.notes)}</div></div>`:''}<div class="box"><b>🚚 بيانات المندوب</b><div style="margin-top:7px">${o.courierName?`<div>👤 ${esc(o.courierName)}</div>`:'<div class="muted">لم يتم تعيين مندوب بعد</div>'}${o.courierPhone?`<div style="margin-top:5px">📞 <a href="tel:${esc(o.courierPhone)}">${esc(o.courierPhone)}</a></div>`:''}</div></div><div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px"><select id="s_${esc(o.id)}" class="input"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='تم التجهيز'?'selected':''}>تم التجهيز</option><option ${o.status==='استلمته شركة الشحن'?'selected':''}>استلمته شركة الشحن</option><option ${o.status==='في الطريق'?'selected':''}>في الطريق</option><option ${o.status==='المندوب قريب'?'selected':''}>المندوب قريب</option><option ${o.status==='تم التسليم'?'selected':''}>تم التسليم</option><option ${o.status==='تعذر التسليم'?'selected':''}>تعذر التسليم</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select><button class="btn primary" onclick="update('${esc(o.id)}')">حفظ الحالة</button></div></div>`}async function load(){const r=await fetch('/api/courier/orders',{headers:{authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){localStorage.removeItem('gm_courier_token');token='';login();return}app.innerHTML='<div class="row"><b>طلبات الشحن ('+d.length+')</b><button class="btn soft" onclick="load()">↻ تحديث</button></div>'+d.map(orderCard).join('')||'<p class="muted">لا توجد طلبات.</p>'}async function update(id){const st=document.getElementById('s_'+id).value;const r=await fetch('/api/courier/orders',{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({id,status:st})});const d=await r.json();if(!r.ok){alert(d.error);return}load()}if(token)load();else login()</script></body></html>
