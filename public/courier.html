<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شركة الشحن | Green Moon</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8f5;color:#17372c}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2e9e3;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 30px #1231}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900;color:#0b5b3d;font-size:22px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dce6df;border-radius:10px;margin:6px 0 10px}button{padding:11px 14px;border:0;border-radius:10px;background:#0b5b3d;color:#fff;font-weight:800;cursor:pointer}.muted{color:#718078;font-size:13px}.grid{display:grid;gap:12px}.order{border:1px solid #e2e9e3;border-radius:16px;padding:15px}.status{font-weight:900;color:#0b5b3d}.err{color:#b42318;background:#fff0ee;padding:10px;border-radius:10px;margin-top:8px}.hidden{display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:600px){.actions{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card" id="login"><div class="brand">🚚 Green Moon — شركة الشحن</div><p class="muted">ادخل كود شركة الشحن لعرض الطلبات وتحديث حالتها.</p><input id="key" type="password" placeholder="كود شركة الشحن"><button onclick="login()">دخول</button><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><div class="top"><div><div class="brand">طلبات الشحن</div><div class="muted">أي تحديث هنا يظهر في تتبع العميل ولوحة Green Moon.</div></div><button onclick="load()">↻ تحديث</button></div></div><div id="orders" class="grid"></div></div></div><script>let key=localStorage.getItem('gmCourierKey')||'';const statuses=['جديد','قيد التجهيز','تم التجهيز','استلمه المندوب','في الطريق','المندوب قريب','تم التسليم','تعذر التسليم','ملغي'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function login(){key=document.getElementById('key').value.trim();if(!key)return;localStorage.setItem('gmCourierKey',key);load()}async function load(){if(!key){document.getElementById('login').classList.remove('hidden');return}const r=await fetch('/api/courier/orders',{headers:{'x-courier-key':key},cache:'no-store'});const d=await r.json();if(r.status===401){localStorage.removeItem('gmCourierKey');key='';document.getElementById('login').classList.remove('hidden');document.getElementById('loginMsg').innerHTML='<div class="err">'+esc(d.error||'كود غير صحيح')+'</div>';return}if(!r.ok){document.getElementById('orders').innerHTML='<div class="err">'+esc(d.error||'حدث خطأ')+'</div>';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('orders').innerHTML=d.map(o=>'<div class="order"><div><b>'+esc(o.id)+'</b> — '+esc(o.name)+'</div><div class="muted">📞 '+esc(o.phone)+'<br>📍 '+esc([o.governorate,o.area,o.street,o.building&&'عمارة '+o.building,o.floor&&'دور '+o.floor,o.apartment&&'شقة '+o.apartment].filter(Boolean).join(' — '))+'</div><p class="status">الحالة الحالية: '+esc(o.status)+'</p><select id="s_'+esc(o.id)+'">'+statuses.map(s=>'<option '+(s===o.status?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select><div class="actions"><button onclick="updateStatus(\''+esc(o.id)+'\')">حفظ الحالة</button><a href="tel:'+esc(o.phone)+'" style="text-decoration:none"><button type="button" style="width:100%;background:#315b4a">📞 اتصال</button></a></div></div>').join('')||'<div class="card">لا توجد طلبات.</div>'}async function updateStatus(id){const status=document.getElementById('s_'+id).value;const r=await fetch('/api/courier/orders',{method:'PUT',headers:{'content-type':'application/json','x-courier-key':key},body:JSON.stringify({id,status})});const d=await r.json();if(!r.ok){alert(d.error||'تعذر التحديث');return}await load()}load();setInterval(load,7000);</script></body></html>
