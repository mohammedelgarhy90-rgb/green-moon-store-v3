<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><title>شركة الشحن — Green Moon</title><style>body{margin:0;background:#f4f7f4;font-family:Cairo,Tahoma,Arial;color:#17372c}.wrap{width:min(900px,calc(100% - 24px));margin:20px auto}.card{background:#fff;border-radius:22px;padding:20px;border:1px solid #e0e7e1;box-shadow:0 10px 30px #12332912}.form{display:grid;gap:10px}.input{padding:12px;border:1px solid #dce6df;border-radius:11px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#0b5b3d;color:#fff}.order{border:1px solid #e1e8e3;border-radius:16px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#718078;font-size:12px}.error{color:#a72a21;background:#fff0ee;padding:10px;border-radius:10px}</style></head><body><div class="wrap"><div class="card"><h1>🚚 شركة الشحن — Green Moon</h1><p class="muted">تحديث حالة الطلب ينعكس مباشرة على العميل وGreen Moon.</p><div id="app"></div></div></div><script>const app=document.getElementById('app');let token=localStorage.getItem('gm_courier_token')||'';function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function login(){app.innerHTML='<div class="form"><input id="pw" class="input" type="password" placeholder="كود شركة الشحن"><button class="btn primary" onclick="doLogin()">دخول</button><div id="m"></div></div>'}async function doLogin(){const r=await fetch('/api/courier/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const d=await r.json();if(!r.ok){document.getElementById('m').className='error';document.getElementById('m').textContent=d.error;return}token=d.token;localStorage.setItem('gm_courier_token',token);load()}async function load(){const r=await fetch('/api/courier/orders',{headers:{authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){localStorage.removeItem('gm_courier_token');token='';login();return}app.innerHTML='<div class="row"><b>طلبات الشحن</b><button class="btn primary" onclick="load()">↻ تحديث</button></div>'+d.map(o=>`<div class="order"><div class="row"><div><b>#${esc(o.id)}</b><div>${esc(o.name)} — ${esc(o.phone)}</div><div class="muted">${esc(o.address)}</div></div><b>${Number(o.total||0)} ج</b></div><div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px"><select id="s_${esc(o.id)}" class="input"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='تم التجهيز'?'selected':''}>تم التجهيز</option><option ${o.status==='استلمته شركة الشحن'?'selected':''}>استلمته شركة الشحن</option><option ${o.status==='في الطريق'?'selected':''}>في الطريق</option><option ${o.status==='المندوب قريب'?'selected':''}>المندوب قريب</option><option ${o.status==='تم التسليم'?'selected':''}>تم التسليم</option><option ${o.status==='تعذر التسليم'?'selected':''}>تعذر التسليم</option></select><button class="btn primary" onclick="update('${esc(o.id)}')">حفظ</button></div></div>`).join('')||'<p class="muted">لا توجد طلبات.</p>'}async function update(id){const st=document.getElementById('s_'+id).value;const r=await fetch('/api/courier/orders',{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({id,status:st})});const d=await r.json();if(!r.ok){alert(d.error);return}load()}if(token)load();else login()</script></body></html>
