<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b"><title>تتبع طلبك — Green Moon</title><style>body{margin:0;background:#f5f7f4;color:#17372c;font-family:Cairo,Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:25px auto}.card{background:#fff;border:1px solid #e0e7e1;border-radius:24px;padding:22px;box-shadow:0 12px 35px #12332912}.brand{text-align:center;color:#0b5b3d}.brand h1{margin:0}.muted{color:#718078}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.btn{display:inline-flex;justify-content:center;align-items:center;padding:11px 15px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;font-weight:800}.primary{background:#0b5b3d;color:#fff}.soft{background:#edf4ef;color:#0b5b3d}.timeline{display:grid;gap:12px;margin-top:18px}.step{display:flex;gap:12px;align-items:flex-start}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e8eee9;color:#6d7b73;font-weight:900;flex:none}.step.on .dot{background:#0b5b3d;color:#fff}.line{border-right:2px solid #dfe7e1;margin-right:14px;height:10px}.meta{font-size:11px;color:#8a9690}.items{display:grid;gap:8px}.item{padding:10px;background:#f7f9f7;border-radius:12px;display:flex;justify-content:space-between}.error{background:#fff0ee;color:#a72a21;padding:13px;border-radius:12px}</style></head><body><div class="wrap"><div class="card"><div class="brand"><div style="font-size:42px">🌿</div><h1>Green Moon</h1><p class="muted">تتبع طلبك لحظة بلحظة</p></div><div id="app"></div></div></div><script>const app=document.getElementById('app');let token=new URLSearchParams(location.search).get('token')||localStorage.getItem('gm_last_tracking_token')||'';function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(o){const tl=Array.isArray(o.timeline)?o.timeline:[];app.innerHTML=`<div class="top"><div><b>طلب #${esc(o.id)}</b><div class="muted">${new Date(o.createdAt).toLocaleString('ar-EG')}</div></div><span class="btn primary">${esc(o.status)}</span></div><div class="timeline">${tl.map((x,i)=>`<div><div class="step on"><div class="dot">✓</div><div><b>${esc(x.status)}</b><div class="meta">${new Date(x.at).toLocaleString('ar-EG')} — ${esc(x.by||'Green Moon')}</div></div></div>${i<tl.length-1?'<div class="line"></div>':''}</div>`).join('')}</div><h3>🛍️ المنتجات المدفوعة</h3><div class="items">${(o.items||[]).map(x=>`<div class="item"><span>${esc(x.name)} × ${Number(x.quantity||1)}</span><b>${Number(x.lineTotal||0)} ج</b></div>`).join('')}</div>${(o.gifts||[]).length?`<h3>🎁 الهدايا</h3><div class="items">${(o.gifts||[]).map(x=>`<div class="item"><span>${esc(x.name||x.productId)} × ${Number(x.quantity||1)}</span><b>0 ج</b></div>`).join('')}</div>`:''}${(o.voucherItems||[]).length?`<h3>🎟️ منتجات القسيمة</h3><div class="items">${(o.voucherItems||[]).map(x=>`<div class="item"><span>${esc(x.name||x.productId)} × ${Number(x.quantity||1)}</span><b>0 ج</b></div>`).join('')}</div>`:''}<div class="item" style="margin-top:10px"><b>الإجمالي</b><b>${Number(o.total||0)} ج</b></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px"><button class="btn soft" onclick="copyLink()">🔗 نسخ الرابط</button><button class="btn primary" onclick="shareLink()">📤 مشاركة</button><a class="btn soft" href="/">🏠 العودة للمتجر</a><a class="btn soft" href="/account.html">👤 حسابي</a></div>`}async function load(){if(!token){app.innerHTML='<div class="error">مش لاقي رابط تتبع. لو عندك رقم/رابط التتبع افتحه مرة تانية.</div>';return}try{const r=await fetch('/api/track/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل الطلب');localStorage.setItem('gm_last_tracking_token',token);render(d.order)}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}function copyLink(){const u=location.href;navigator.clipboard?.writeText(u).then(()=>alert('تم نسخ رابط التتبع'))}async function shareLink(){if(navigator.share)await navigator.share({title:'تتبع طلب Green Moon',url:location.href});else copyLink()}load();setInterval(load,7000)</script></body></html>
