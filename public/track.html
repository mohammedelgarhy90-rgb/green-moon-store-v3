<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع طلبك | Green Moon</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f8f5;color:#17372c}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e9e3;border-radius:24px;padding:22px;box-shadow:0 12px 40px #1231}.brand{font-weight:900;color:#0b5b3d;font-size:22px}.muted{color:#68776f}.status{font-size:22px;font-weight:900;margin:14px 0}.timeline{margin-top:22px}.row{display:flex;gap:12px;align-items:flex-start;margin:0 0 18px}.dot{width:16px;height:16px;border-radius:50%;background:#d8e2dc;margin-top:4px;flex:0 0 16px}.row.done .dot{background:#0b5b3d}.row.current .dot{background:#e7bf62;box-shadow:0 0 0 6px #e7bf6233}.line{border-right:2px solid #dfe8e2;margin-right:7px;padding-right:20px}.time{font-size:11px;color:#8a958f}.err{color:#b42318;background:#fff0ee;padding:12px;border-radius:12px}.refresh{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:#0b5b3d;color:#fff;font-weight:900}</style></head><body><div class="wrap"><div class="card"><div class="brand">🌿 Green Moon</div><p class="muted">تتبع طلبك لحظة بلحظة</p><div id="app">جاري تحميل حالة الطلب...</div><button class="refresh" onclick="load()">↻ تحديث الحالة</button></div></div><script>const q=new URLSearchParams(location.search),token=q.get('token'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fmt(x){try{return new Date(x).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}catch{return x}}async function load(){if(!token){app.innerHTML='<div class="err">رابط التتبع غير صالح.</div>';return}try{const r=await fetch('/api/track?token='+encodeURIComponent(token),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل الطلب');const hist=Array.isArray(d.statusHistory)?d.statusHistory:[];app.innerHTML='<div class="status">'+esc(d.status||'جديد')+'</div><div><b>طلب رقم:</b> '+esc(d.id)+'</div><div class="muted" style="margin-top:8px">'+esc(d.name)+' • '+esc(d.phone)+'</div><div class="timeline line">'+hist.map((h,i)=>'<div class="row '+(i===hist.length-1?'current ':'')+'done"><span class="dot"></span><div><b>'+esc(h.status)+'</b><div class="time">'+esc(fmt(h.at))+'</div>'+(h.note?'<div class="muted">'+esc(h.note)+'</div>':'')+'</div></div>').join('')+'</div>'}catch(e){app.innerHTML='<div class="err">'+esc(e.message)+'</div>'}}load();setInterval(load,7000);</script></body></html>
