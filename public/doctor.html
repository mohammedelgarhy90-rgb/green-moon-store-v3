<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b2b">
<title>Green Moon Doctor | تشخيص مشاكل النباتات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#063b2b;--gold:#e7bf62;--ink:#18392e;--muted:#68776f;--line:#e2e9e3}*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:var(--ink);font-family:Cairo,Tahoma,sans-serif}.top{background:var(--green);color:white;padding:15px 20px}.top a{color:var(--gold);text-decoration:none;font-weight:800}.wrap{width:min(760px,calc(100% - 24px));margin:24px auto 60px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 35px #063b2b0c}.eyebrow{color:#9a7625;font-weight:800;font-size:12px;letter-spacing:1px}h1{margin:6px 0 8px;font-size:clamp(28px,6vw,40px);color:var(--green)}p{line-height:1.9;color:var(--muted)}label{display:block;font-weight:800;margin:16px 0 7px}input[type=file],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfa;font:inherit}textarea{min-height:90px;resize:vertical}.preview{display:none;max-width:100%;max-height:320px;border-radius:14px;margin-top:12px;object-fit:contain}.btn{border:0;border-radius:12px;background:var(--green);color:white;font:inherit;font-weight:800;padding:13px 18px;width:100%;margin-top:15px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.notice{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#f2f7f1;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{background:#fff1ef;color:#9d2b22}.back{display:inline-block;margin-top:18px;color:var(--green);font-weight:800;text-decoration:none}
</style></head><body>
<header class="top"><a href="/">← Green Moon Plants & Flowers</a></header>
<main class="wrap"><section class="card"><span class="eyebrow">GREEN MOON PLANT CARE</span><h1>دكتور جرين مون 🌿</h1><p>ارفع صورة واضحة للنبات، واكتب أي تفاصيل عن الري أو مكان النبات أو الأعراض. هنحاول نوضح الاحتمالات وخطوات العناية المناسبة. التشخيص من الصورة إرشادي ومش بديل لفحص النبات مباشرة.</p>
<form id="doctorForm"><label for="plantImage">صورة النبات *</label><input id="plantImage" type="file" accept="image/jpeg,image/png,image/webp" required><img id="preview" class="preview" alt="معاينة صورة النبات"><label for="note">معلومات إضافية (اختياري)</label><textarea id="note" maxlength="1000" placeholder="مثلاً: الاصفرار بدأ من أسبوع، وبسقيه كل 3 أيام..."></textarea><button id="submit" class="btn" type="submit">حلّل صورة النبات</button></form><div id="notice" class="notice" role="status" aria-live="polite"></div><a class="back" href="/">العودة للمتجر ←</a></section></main>
<script>
(()=>{'use strict';const form=document.getElementById('doctorForm'),file=document.getElementById('plantImage'),preview=document.getElementById('preview'),notice=document.getElementById('notice'),button=document.getElementById('submit');let dataUrl='';
function show(msg,error=false){notice.style.display='block';notice.classList.toggle('error',error);notice.textContent=msg}
file.addEventListener('change',()=>{const f=file.files&&file.files[0];dataUrl='';if(!f){preview.style.display='none';return}if(!/^image\/(jpeg|png|webp)$/.test(f.type)){file.value='';show('اختار صورة JPG أو PNG أو WebP.',true);return}if(f.size>5*1024*1024){file.value='';show('حجم الصورة كبير. اختار صورة أقل من 5 ميجابايت.',true);return}const reader=new FileReader();reader.onload=()=>{dataUrl=String(reader.result||'');preview.src=dataUrl;preview.style.display='block';notice.style.display='none'};reader.onerror=()=>show('تعذر قراءة الصورة. جرّب صورة تانية.',true);reader.readAsDataURL(f)});
form.addEventListener('submit',async e=>{e.preventDefault();if(!dataUrl){show('ارفع صورة واضحة للنبات الأول.',true);return}button.disabled=true;button.textContent='جاري تحليل الصورة...';show('جاري تحليل صورة النبات. ممكن يستغرق شوية وقت...');try{const res=await fetch('/api/doctor/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl,note:document.getElementById('note').value.trim()})});let result={};try{result=await res.json()}catch{}if(!res.ok)throw new Error(result.error||'تعذر تحليل الصورة دلوقتي. جرّب تاني بعد شوية.');show(result.result||'التحليل اكتمل لكن مفيش تفاصيل رجعت. جرّب تاني.')}catch(err){show(err.message||'في مشكلة اتصال. تأكد من الإنترنت وحاول تاني.',true)}finally{button.disabled=false;button.textContent='حلّل صورة النبات'}});
})();
</script></body></html>
