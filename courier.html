<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06251a"><title>لوحة شركة الشحن — Green Moon</title><style>body{margin:0;background:#f3f6f3;color:#17251e;font-family:system-ui,Tahoma,Arial}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e8e3;border-radius:22px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.order{border:1px solid #e0e7e2;border-radius:18px;padding:15px}.status{width:100%;padding:11px;border:1px solid #dbe4de;border-radius:12px;background:#fff;margin-top:10px}button{border:0;border-radius:12px;padding:11px 15px;background:#0b5b3d;color:#fff;font-weight:900}input{padding:12px;border:1px solid #dbe4de;border-radius:12px;width:100%;box-sizing:border-box}.muted{color:#75827c;font-size:12px}.hidden{display:none!important}</style></head><body><div class="wrap"><div id="login" class="card"><h2>🚚 دخول شركة الشحن</h2><p class="muted">اكتب كود شركة الشحن.</p><input id="pass" type="password" placeholder="كود الشحن"><button style="margin-top:10px" onclick="login()">دخول</button><p id="msg" class="muted"></p></div><div id="app" class="hidden"><div class="card head"><div><h2 style="margin:0">🚚 طلبات الشحن</h2><p class="muted">أي تحديث هنا يظهر فورًا في سجل الطلب ورابط تتبع العميل.</p></div><button onclick="load()">↻ تحديث</button></div><div id="orders" class="grid"></div></div></div><script>let key=sessionStorage.getItem('gmCourierKey')||'';const steps=['جديد','قيد التجهيز','تم التجهيز','استلمته شركة الشحن','في الطريق','المندوب قريب','تم التسليم','تعذر التسليم','ملغي'];function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(opt={}){const r=await fetch('/api/courier/orders',{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+key,...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'خطأ');return d}async function login(){key=document.getElementById('pass').value.trim();try{await load();sessionStorage.setItem('gmCourierKey',key);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}catch(e){document.getElementById('msg').textContent=e.message}}async function update(id,status){await api({method:'PUT',body:JSON.stringify({id,status,by:'شركة الشحن'})});await load()}async function load(){const list=await api();document.getElementById('orders').innerHTML=list.map(o=>`<div class="order"><b>${esc(o.id)}</b><h3 style="margin:8px 0">${esc(o.name||'')}</h3><div class="muted">📞 ${esc(o.phone||'')}<br>📍 ${esc([o.governorate,o.area,o.street,o.building,o.floor,o.apartment].filter(Boolean).join(' — '))}</div><select class="status" onchange="update('${esc(o.id)}',this.value)">${steps.map(s=>`<option ${o.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select><div class="muted" style="margin-top:9px">${esc(o.statusHistory?.slice(-1)[0]?.at||o.createdAt||'')}</div></div>`).join('')||'<div class="card">لا توجد طلبات.</div>'}if(key){load().then(()=>{document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}).catch(()=>sessionStorage.removeItem('gmCourierKey'));}setInterval(()=>{if(key&&!document.getElementById('app').classList.contains('hidden'))load().catch(()=>{})},10000);</script></body></html>
